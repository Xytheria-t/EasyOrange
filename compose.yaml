# =============================================================================
# EasyOrange 本地开发栈
# 凭据/端口的唯一来源 = 仓库根 .env（Docker Compose 原生自动读取本文件做插值）。
# 全部写成 ${VAR:-default}，因此没有 .env 也能零配置启动（走默认值）。
# 容器内主机名（mysql/redis/rabbitmq 等基础设施）仍显式覆盖 —— 那是 compose 服务 DNS，
# 与 .env 里宿主机视角的 localhost 不是一回事。
# 注意：本文件用 ${VAR:-default}（compose/shell 语法）；application*.yaml 必须用
# ${VAR:default}（单冒号），写错会让 Spring 把 "-default" 当字面量。
# =============================================================================
services:
  mysql:
    image: mysql:8.4.11
    container_name: easyorange-mysql
    hostname: easyorange-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: ${EASYORANGE_DB_NAME:-easyorange}
      # MYSQL_USER/MYSQL_PASSWORD 必须与应用连接的 EASYORANGE_DB_* 同源，否则应用连不上
      MYSQL_USER: ${EASYORANGE_DB_USERNAME:-easyorange_app}
      MYSQL_PASSWORD: ${EASYORANGE_DB_PASSWORD:-easyorange_app_dev}
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --mysql-native-password=ON
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p${MYSQL_ROOT_PASSWORD:-root123456}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:8.10.0-alpine
    container_name: easyorange-redis
    hostname: easyorange-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:-easyorange123}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-easyorange123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  rabbitmq:
    image: rabbitmq:4.3.4-management
    container_name: easyorange-rabbitmq
    hostname: easyorange-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-easyorange}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-easyorange123}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      # 启用内置 rabbitmq_prometheus 插件（:15692/metrics），Prometheus 采集队列/消费指标
      - ./infra/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ---------------------------------------------------------------------------
  # ES 搜索 — 镜像内置 IK 分词插件，构建/体量较大，不随三件套默认拉起：
  #   docker compose --profile search up -d        # 单起 ES（本地跑后端时必须：dev profile 默认开 ES）
  #   docker compose --profile fullstack up -d     # 全栈时随 app 一起拉起（app 启动期即建索引，故同 profile）
  # ES 集成测试（application-it-es.yaml）通过 services 显式点名启动本服务。
  elasticsearch:
    profiles: [search, fullstack]
    build: ./infra/elasticsearch
    image: easyorange-elasticsearch:local
    container_name: easyorange-es
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"   # 本地单节点，免用户/证书配置
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -Eq '\"status\":\"(green|yellow)\"' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  easyorange-app:
    # 后端应用 — 支持多实例：docker compose --profile fullstack up -d --scale easyorange-app=3
    # 多实例由 nginx upstream + Prometheus dns_sd 自动发现，无需改配置
    # 注意：无 container_name（固定名字会让 --scale 报错），nginx 走服务 DNS 名
    # profile: fullstack — 裸 `docker compose up -d` 仍是纯开发三件套（MySQL/Redis/RabbitMQ），
    # 不会触发后端镜像构建（2-5 分钟）或拉取观测镜像，日常热循环零影响
    profiles: [fullstack]
    build:
      context: ./easyorange-backend
    image: easyorange-backend:local
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: dev          # 覆盖 Dockerfile 的 prod（本地栈用 dev：自动生成 JWT 密钥 + 宽松限流）
      # 主机名走容器内 DNS，覆盖 .env 里宿主机视角的 localhost
      EASYORANGE_DB_HOST: mysql
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      # 凭据与容器初始化同源于根 .env（不落此处字面量）
      EASYORANGE_DB_PORT: ${EASYORANGE_DB_PORT:-3306}
      EASYORANGE_DB_NAME: ${EASYORANGE_DB_NAME:-easyorange}
      EASYORANGE_DB_USERNAME: ${EASYORANGE_DB_USERNAME:-easyorange_app}
      EASYORANGE_DB_PASSWORD: ${EASYORANGE_DB_PASSWORD:-easyorange_app_dev}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-easyorange123}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-easyorange}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-easyorange123}
      # 压测透传开关：RATE_LIMIT_FILTER_ENABLED=false docker compose up -d --scale easyorange-app=2
      RATE_LIMIT_FILTER_ENABLED: ${RATE_LIMIT_FILTER_ENABLED:-true}
      # dev profile 默认启用 ES 搜索，容器内 DNS 名覆盖宿主机视角的 localhost
      ES_URIS: http://elasticsearch:9200
      # LLM trace 上报 → compose 内 Langfuse（host 视角 :3001，容器内 DNS 是 3000）
      LANGFUSE_OTLP_ENDPOINT: http://langfuse-web:3000/api/public/otel/v1/traces
      # Basic 认证值与 .env 的 LANGFUSE_INIT_PROJECT_* 初始化键同源（base64(public:secret)）
      LANGFUSE_OTLP_BASIC_AUTH: ${LANGFUSE_OTLP_BASIC_AUTH:-Basic cGstbGYtZWFzeW9yYW5nZS1kZXY6c2stbGYtZWFzeW9yYW5nZS1kZXYtc2VjcmV0}
    ports:
      # 端口区间：scale=1 占 8080，scale=N 依次占 8080..8080+N-1（无需改配置即可多实例）
      - "8080-8085:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      # dev profile 下 app 启动期就要建 ES 索引，ES 未就绪会直接启动失败
      elasticsearch:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # 前端镜像 — nginx 静态站 + 内部反代（/api /ws → easyorange-app upstream）。
  # 与 easyorange-app 同 profile，docker compose --profile fullstack up -d --build
  # 即一键全栈，浏览器访问 http://localhost（日常热循环开发仍走 npm run dev :5173）。
  # HTTPS 可选：证书 + ssl.conf 挂载进 conf.d 后启用，见 easyorange-frontend/ssl.conf.example
  # ---------------------------------------------------------------------------
  easyorange-frontend:
    profiles: [fullstack]
    build: ./easyorange-frontend
    image: easyorange-frontend:local
    container_name: easyorange-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      easyorange-app:
        condition: service_started

  prometheus:
    image: prom/prometheus:v3.13.2
    container_name: easyorange-prometheus
    restart: unless-stopped
    profiles: [fullstack]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      easyorange-app:
        condition: service_started

  # ---------------------------------------------------------------------------
  # 告警 — Alertmanager 接收 Prometheus 告警并分组路由；本地演示无外部通知渠道，
  # 告警在 :9093 UI 可视化，接渠道时改 infra/alertmanager/alertmanager.yml
  # ---------------------------------------------------------------------------
  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: easyorange-alertmanager
    restart: unless-stopped
    profiles: [fullstack]
    volumes:
      - ./infra/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"

  # ---------------------------------------------------------------------------
  # 日志聚合 — Loki + Promtail（docker_sd 采集本 compose 项目容器日志，含 traceId 标签）
  # ---------------------------------------------------------------------------
  loki:
    image: grafana/loki:3.5.1
    container_name: easyorange-loki
    restart: unless-stopped
    profiles: [fullstack]
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./infra/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"

  promtail:
    image: grafana/promtail:3.5.1
    container_name: easyorange-promtail
    restart: unless-stopped
    profiles: [fullstack]
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./infra/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail-positions:/tmp
    depends_on:
      loki:
        condition: service_started

  # ---------------------------------------------------------------------------
  # 中间件 exporter — MySQL/Redis 指标（RabbitMQ 走内置 rabbitmq_prometheus 插件 :15692）
  # ---------------------------------------------------------------------------
  mysqld-exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: easyorange-mysqld-exporter
    restart: unless-stopped
    profiles: [fullstack]
    command:
      - --mysqld.address=mysql:3306
      - --mysqld.username=${EASYORANGE_DB_USERNAME:-easyorange_app}
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${EASYORANGE_DB_PASSWORD:-easyorange_app_dev}
    ports:
      - "9104:9104"

  redis-exporter:
    image: oliver006/redis_exporter:v1.66.0
    container_name: easyorange-redis-exporter
    restart: unless-stopped
    profiles: [fullstack]
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-easyorange123}
    ports:
      - "9121:9121"

  grafana:
    image: grafana/grafana-oss:13.0.2
    container_name: easyorange-grafana
    restart: unless-stopped
    profiles: [fullstack]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      # 本地监控栈匿名只读（仅 localhost 暴露），免登录直达 dashboard
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SERVER_ROOT_URL: http://localhost:3000
      # AI 可观测性面板的 MySQL 数据源（datasources.yml 引用 GRAFANA_MYSQL_*）
      GRAFANA_MYSQL_USER: ${EASYORANGE_DB_USERNAME:-easyorange_app}
      GRAFANA_MYSQL_PASSWORD: ${EASYORANGE_DB_PASSWORD:-easyorange_app_dev}
      GRAFANA_MYSQL_HOST: mysql
      GRAFANA_MYSQL_DB: ${EASYORANGE_DB_NAME:-easyorange}
    volumes:
      # provisioning 即代码：datasource + dashboard 随仓库版本化
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_started

  # ---------------------------------------------------------------------------
  # LLM 可观测 — Langfuse 自托管（W3-4）：Spring AI Observation → OTel → OTLP → Langfuse。
  # web UI / OTLP 入口 :3001（3000 已被 Grafana 占用）；基础设施不映射 host 端口，仅容器网络可达。
  # 首次启动经 LANGFUSE_INIT_* 自动建组织 / 项目 / 用户，pk/sk 固定，供应用 OTLP Basic 认证
  # （与 .env / application.yaml 的 LANGFUSE_OTLP_BASIC_AUTH 同源；改键须删 langfuse-postgres 卷重建）。
  # 应用容器内 endpoint 由 easyorange-app 的 LANGFUSE_OTLP_ENDPOINT 指向 langfuse-web:3000。
  # 随后端一起拉起：docker compose --profile fullstack up -d；仅观测栈：
  #   docker compose --profile langfuse up -d
  # worker 持共享环境锚点，web 用 <<: 合并并追加初始化键（YAML 锚点先定义后引用，故 worker 在前）
  # ---------------------------------------------------------------------------
  langfuse-worker:
    image: langfuse/langfuse-worker:4
    container_name: easyorange-langfuse-worker
    hostname: easyorange-langfuse-worker
    restart: unless-stopped
    profiles: [fullstack, langfuse]
    environment: &langfuse-common
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3001}
      # 密钥三元组生产必改（.env 覆盖）；dev 默认值仅本地演示用
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dd6e863940d3e0844bfb32a639e147e7100d9023304b2e5089504f3f2220d659}
      SALT: ${LANGFUSE_SALT:-186a5a127b2dea4d501579f904b554b1}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:-ffbeac7d1c7ec16e24699606766918f53998387804a957332c61f2a71bfd23c4}
      TELEMETRY_ENABLED: "false"
      DATABASE_URL: postgresql://${LANGFUSE_PG_USER:-postgres}:${LANGFUSE_PG_PASSWORD:-easyorange123}@langfuse-postgres:5432/postgres
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_USER: ${LANGFUSE_CH_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CH_PASSWORD:-easyorange123}
      # 单节点必须显式 false：缺省时 Langfuse 走 ReplicatedMergeTree（要 ZooKeeper），迁移报 no Zookeeper configuration
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_HOST: langfuse-redis
      REDIS_PORT: "6379"
      REDIS_AUTH: ${LANGFUSE_REDIS_PASSWORD:-easyorange123}
      # 事件摄取（必需）与媒体上传（文本 trace 不用，端点仅容器内可达）
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_S3_KEY:-minio}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_S3_SECRET:-miniosecret}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_S3_KEY:-minio}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_S3_SECRET:-miniosecret}
      LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
    depends_on:
      langfuse-postgres:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy

  langfuse-web:
    image: langfuse/langfuse:4
    container_name: easyorange-langfuse-web
    hostname: easyorange-langfuse-web
    restart: unless-stopped
    profiles: [fullstack, langfuse]
    ports:
      - "3001:3000"
    environment:
      <<: *langfuse-common
      # 仅首次启动（空库）生效：自动建组织 / 项目 / 用户，并固定 pk/sk。
      # v4 要求 ORG_ID / PROJECT_ID 必须显式设置，否则整组 INIT 变量被忽略（见 web 启动日志）
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID:-easyorange-org}
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME:-EasyOrange}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID:-easyorange-dev}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME:-easyorange-dev}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-admin@easyorange.dev}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:-EasyOrange Admin}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-Password123}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:-pk-lf-easyorange-dev}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY:-sk-lf-easyorange-dev-secret}
    depends_on:
      langfuse-postgres:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy

  langfuse-clickhouse:
    image: docker.io/clickhouse/clickhouse-server:25.12
    container_name: easyorange-langfuse-clickhouse
    hostname: easyorange-langfuse-clickhouse
    restart: unless-stopped
    profiles: [fullstack, langfuse]
    # 官方镜像要求固定 uid/gid 101 运行
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: ${LANGFUSE_CH_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CH_PASSWORD:-easyorange123}
    volumes:
      - langfuse-clickhouse-data:/var/lib/clickhouse
      - langfuse-clickhouse-logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  langfuse-minio:
    image: cgr.dev/chainguard/minio
    container_name: easyorange-langfuse-minio
    hostname: easyorange-langfuse-minio
    restart: unless-stopped
    profiles: [fullstack, langfuse]
    entrypoint: sh
    # 先建 langfuse bucket 再启动服务（免初始化容器）
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: ${LANGFUSE_S3_KEY:-minio}
      MINIO_ROOT_PASSWORD: ${LANGFUSE_S3_SECRET:-miniosecret}
    volumes:
      - langfuse-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 5s
      retries: 5
      start_period: 5s

  langfuse-postgres:
    image: docker.io/postgres:17
    container_name: easyorange-langfuse-postgres
    hostname: easyorange-langfuse-postgres
    restart: unless-stopped
    profiles: [fullstack, langfuse]
    environment:
      POSTGRES_USER: ${LANGFUSE_PG_USER:-postgres}
      POSTGRES_PASSWORD: ${LANGFUSE_PG_PASSWORD:-easyorange123}
      POSTGRES_DB: ${LANGFUSE_PG_DB:-postgres}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - langfuse-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LANGFUSE_PG_USER:-postgres}"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  langfuse-redis:
    image: redis:8.10.0-alpine
    container_name: easyorange-langfuse-redis
    hostname: easyorange-langfuse-redis
    restart: unless-stopped
    profiles: [fullstack, langfuse]
    # Langfuse 队列（BullMQ）要求 noeviction：缓存式淘汰会丢摄取任务
    command: redis-server --appendonly yes --maxmemory-policy noeviction --requirepass ${LANGFUSE_REDIS_PASSWORD:-easyorange123}
    volumes:
      - langfuse-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${LANGFUSE_REDIS_PASSWORD:-easyorange123}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  es-data:
  grafana-data:
  loki-data:
  promtail-positions:
  langfuse-postgres-data:
  langfuse-clickhouse-data:
  langfuse-clickhouse-logs:
  langfuse-minio-data:
  langfuse-redis-data:
