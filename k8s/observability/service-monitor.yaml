# =============================================================================
# Backend 指标抓取 — Prometheus Operator ServiceMonitor
# =============================================================================
# 前置: 已安装 kube-prometheus-stack（监控命名空间）。
# Prometheus 通过 serviceMonitorSelector 选择 ServiceMonitor —— 默认带 release 标签，
# 若你的 Helm release 名不同，请同步修改 selector 标签。
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: easyorange-backend
  namespace: monitoring
  labels:
    app.kubernetes.io/name: easyorange
    app.kubernetes.io/component: backend
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: easyorange
      app.kubernetes.io/component: backend
  namespaceSelector:
    matchNames:
      - easyorange
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 30s
      scrapeTimeout: 10s
      # 高基数告警示例（按需启用）:
      # metricRelabelings:
      #   - sourceLabels: [uri]
      #     regex: /api/products/.*
      #     replacement: /api/products/{id}
      #     targetLabel: uri
