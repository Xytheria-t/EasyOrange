# =============================================================================
# 非敏感配置（敏感项一律走 Secret，见 overlays/<env>/env/）
# =============================================================================
# 说明:
#   • SPRING_PROFILES_ACTIVE=prod → 使用 application-prod.yaml 的生产语义
#   • JWT_RSA_* 指向 Secret 挂载的 PEM 文件路径（overlay 提供 easyorange-jwt-keys）
#   • demo 覆盖项（SPRING_DATA_REDIS_SSL、JWT_REFRESH_COOKIE_SECURE、SPRING_DATASOURCE_URL）
#     由 overlay 通过 strategic merge patch 追加
apiVersion: v1
kind: ConfigMap
metadata:
  name: easyorange-config
  labels:
    app.kubernetes.io/name: easyorange
    app.kubernetes.io/component: backend
data:
  SPRING_PROFILES_ACTIVE: "prod"
  EASYORANGE_DB_HOST: "mysql"
  EASYORANGE_DB_PORT: "3306"
  EASYORANGE_DB_NAME: "easyorange"
  EASYORANGE_DB_USERNAME: "easyorange_app"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  RABBITMQ_HOST: "rabbitmq"
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: "easyorange"
  CORS_ALLOWED_ORIGINS: "http://easyorange.local"
  JWT_RSA_PRIVATE_KEY: "/app/keys/private.pem"
  JWT_RSA_PUBLIC_KEY: "/app/keys/public.pem"
  RATE_LIMIT_FILTER_ENABLED: "true"
  TRACING_SAMPLING_PROBABILITY: "0.1"
