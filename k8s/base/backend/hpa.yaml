# 水平弹性 — CPU 利用率 70% 触发扩容（Java 负载与 CPU 强相关，最可靠）
# 内存不进 HPA 指标：GC 会掩盖真实内存压力，Java 内存扩容易误判（现代实践共识）
# behavior: 缩容稳定窗口 300s 防抖动，扩容 60s 快速响应
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: easyorange-backend
  labels:
    app.kubernetes.io/name: easyorange
    app.kubernetes.io/component: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: easyorange-backend
  minReplicas: 2
  maxReplicas: 6
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
