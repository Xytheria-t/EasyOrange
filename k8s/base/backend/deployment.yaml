# =============================================================================
# EasyOrange Backend — 无状态应用部署（K8s 主场：多副本 + HPA + 滚动发布）
# =============================================================================
# 设计要点（现代化最佳实践）:
#   • 优雅停机: server.shutdown=graceful (90s) → terminationGracePeriodSeconds=120
#     Spring 收到 SIGTERM 后先摘流量再排空在途请求，配合 maxUnavailable=0 实现零中断滚动
#   • 探针三件套: startup(/actuator/health) 放行冷启动窗口（JVM+Flyway+连接池最长 360s），
#     readiness(/actuator/health/readiness 含 DB/Redis/Rabbit 就绪指标) 摘流量，
#     liveness(/actuator/health/liveness 仅 JVM) 不因中间件抖动误杀
#   • 只读根文件系统: 日志(/app/logs)、JVM 临时文件(/tmp) 走 emptyDir，上传(/var/easyorange/uploads) 走 PVC
#   • 最小权限: automountServiceAccountToken=false + drop ALL cap + seccomp RuntimeDefault + 非 root(1000)
#   • 配置分层: 非敏感 → ConfigMap；敏感(DB/Redis/RabbitMQ 密码 + AI key) → Secret(overlay 注入)；
#     JWT RSA PEM → Secret 只读挂载（prod profile 要求密钥文件路径）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: easyorange-backend
  labels:
    app.kubernetes.io/name: easyorange
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0        # 先起新的再杀旧的 → 发布零中断
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: easyorange
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: easyorange
        app.kubernetes.io/component: backend
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 2000          # PVC 挂载根目录归属 → 非 root 进程可写 uploads
      containers:
        - name: app
          image: easyorange-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: easyorange-config
            - secretRef:
                name: easyorange-secrets
          volumeMounts:
            - name: uploads
              mountPath: /var/easyorange/uploads
            - name: tmp
              mountPath: /tmp
            - name: logs
              mountPath: /app/logs
            - name: jwt-keys
              mountPath: /app/keys
              readOnly: true
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 36    # 最长 360s 冷启动窗口（JVM + Flyway + 连接池）
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            # JVM -Xmx2g，limit 需预留 metaspace + 线程 + native ≈ 堆的 50%
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 3Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: easyorange-uploads
        - name: tmp
          emptyDir: {}
        - name: logs
          emptyDir: {}
        - name: jwt-keys
          secret:
            secretName: easyorange-jwt-keys
            optional: false
