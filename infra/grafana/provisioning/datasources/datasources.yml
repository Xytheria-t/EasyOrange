# Grafana datasource provisioning — 随仓库版本化，启动即注入
apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
  # MySQL 数据源 — AI 观测面板的 Judge 均分 / 调用量趋势数据源
  # 连接信息经环境变量注入（docker compose 的 GRAFANA_MYSQL_* 变量），默认连本地 3306
  - name: MySQL
    type: mysql
    uid: mysql
    access: proxy
    url: ${GRAFANA_MYSQL_HOST:mysql}:${GRAFANA_MYSQL_PORT:3306}
    database: ${GRAFANA_MYSQL_DB:easyorange}
    user: ${GRAFANA_MYSQL_USER:easyorange}
    jsonData:
      maxOpenConns: 5
    secureJsonData:
      password: ${GRAFANA_MYSQL_PASSWORD:easyorange_app_dev}
    editable: false
  # Loki 日志数据源 — Promtail 采集容器日志（含 level/traceId 标签），Explore 直接按 traceId 检索全链路日志
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    editable: false
