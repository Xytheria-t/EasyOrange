services:
  mysql:
    image: mysql:8.4
    container_name: easyorange-mysql
    hostname: easyorange-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: ${EASYORANGE_DB_NAME:-easyorange}
      MYSQL_USER: ${EASYORANGE_DB_USERNAME:-easyorange_app}
      MYSQL_PASSWORD: ${EASYORANGE_DB_PASSWORD:-easyorange_app_dev}
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --init-connect=SET NAMES utf8mb4
      - --ngram-token-size=2
      - --mysql-native-password=ON
    networks:
      - easyorange-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G

  redis:
    image: redis:7.4-alpine
    container_name: easyorange-redis
    hostname: easyorange-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:-easyorange123}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - easyorange-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-easyorange123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: easyorange-rabbitmq
    hostname: easyorange-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: easyorange
      RABBITMQ_DEFAULT_PASS: easyorange123
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    networks:
      - easyorange-net

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:

networks:
  easyorange-net:
    driver: bridge
