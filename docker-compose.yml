services:
  mysql:
    image: mysql:8.0
    container_name: easyorange-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: ${EASYORANGE_DB_NAME:-easyorange}
      MYSQL_USER: ${EASYORANGE_DB_USERNAME:-easyorange_app}
      MYSQL_PASSWORD: ${EASYORANGE_DB_PASSWORD:-easyorange_app_dev}
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - easyorange-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: easyorange-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - easyorange-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  backend:
    build:
      context: ./easyorange-backend
      dockerfile: Dockerfile
    image: easyorange-backend:latest
    container_name: easyorange-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      EASYORANGE_DB_HOST: mysql
      EASYORANGE_DB_PORT: 3306
      EASYORANGE_DB_NAME: ${EASYORANGE_DB_NAME:-easyorange}
      EASYORANGE_DB_USERNAME: ${EASYORANGE_DB_USERNAME:-easyorange_app}
      EASYORANGE_DB_PASSWORD: ${EASYORANGE_DB_PASSWORD:-easyorange_app_dev}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80}
    ports:
      - "8080:8080"
    volumes:
      - upload-data:/app/upload
    networks:
      - easyorange-net
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 768M

  frontend:
    build:
      context: ./easyorange-frontend
      dockerfile: Dockerfile
    image: easyorange-frontend:latest
    container_name: easyorange-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./easyorange-frontend/ssl:/etc/nginx/ssl:ro
      - nginx-cache:/var/cache/nginx
    networks:
      - easyorange-net
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  mysql-data:
  redis-data:
  upload-data:
  nginx-cache:

networks:
  easyorange-net:
    driver: bridge
