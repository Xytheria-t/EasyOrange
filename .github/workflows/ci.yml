name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: easyorange-frontend/package-lock.json

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('easyorange-backend/pom.xml', 'easyorange-backend/**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: easyorange-frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('easyorange-frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Backend compile
        run: ./mvnw compile -pl easyorange-application -am
        working-directory: easyorange-backend

      - name: Backend tests
        run: ./mvnw test -pl easyorange-application -am
        working-directory: easyorange-backend

      - name: Frontend install dependencies
        run: npm ci
        working-directory: easyorange-frontend

      - name: Frontend typecheck
        run: npm run typecheck
        working-directory: easyorange-frontend

      - name: Frontend lint
        run: npm run lint
        working-directory: easyorange-frontend

      - name: Frontend tests
        run: npm test
        working-directory: easyorange-frontend