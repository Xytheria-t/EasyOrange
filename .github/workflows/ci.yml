name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    timeout-minutes: 45
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: easyorange-frontend/package-lock.json

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('easyorange-backend/pom.xml', 'easyorange-backend/**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: easyorange-frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('easyorange-frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # 后端：全量 11 模块测试（不再用 -pl easyorange-application -am 漏测其他模块）
      - name: Backend full test (11 modules)
        run: ./mvnw test -B
        working-directory: easyorange-backend

      # 后端：verify 阶段启用 JaCoCo + PIT 质量门禁
      - name: Backend verify (JaCoCo gate + PIT mutation)
        run: |
          ./mvnw verify -B \
            -Djacoco.haltOnFailure=true \
            -Ppit \
            -Dpit.mutationThreshold=60 \
            -Dpit.testStrengthThreshold=75 \
            -Dpit.coverageThreshold=70 \
            -DskipTests=true
        working-directory: easyorange-backend

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: easyorange-backend/**/target/site/jacoco/
          if-no-files-found: ignore

      - name: Upload PIT report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pit-report
          path: easyorange-backend/**/target/pit-reports/
          if-no-files-found: ignore

      - name: Frontend install dependencies
        run: npm ci
        working-directory: easyorange-frontend

      - name: Frontend typecheck
        run: npm run typecheck
        working-directory: easyorange-frontend

      - name: Frontend lint
        run: npm run lint
        working-directory: easyorange-frontend

      - name: Frontend tests
        run: npm test
        working-directory: easyorange-frontend

  # OWASP CVE 扫描独立并行 job，避免拖慢主流水线
  security-scan:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    # 仅在 main/develop 分支 push 时跑（PR 跳过以加速）
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('easyorange-backend/pom.xml', 'easyorange-backend/**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: OWASP Dependency Check
        run: ./mvnw org.owasp:dependency-check-maven:check -B -DskipTests=true
        working-directory: easyorange-backend

      - name: Upload OWASP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: easyorange-backend/target/dependency-check-report.html
          if-no-files-found: ignore
