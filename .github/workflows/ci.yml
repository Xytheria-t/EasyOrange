name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: easyorange
        ports:
          - 3306:3306
      redis:
        image: redis:7.4
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'
      - name: Backend tests
        working-directory: easyorange-backend
        run: ./mvnw test -B

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: easyorange-frontend/package-lock.json
      - name: Install dependencies
        working-directory: easyorange-frontend
        run: npm ci
      - name: Lint check
        working-directory: easyorange-frontend
        run: npx tsc --noEmit
      - name: Unit tests with coverage
        working-directory: easyorange-frontend
        run: npm run test:coverage
      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          directory: easyorange-frontend/coverage
          fail_ci_if_error: false
