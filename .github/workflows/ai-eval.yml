name: AI eval gate (on-demand)

# 金标准评测门禁（GoldenSetRegressionIT）—— 需要真实 AI key（产生 API 费用且慢），
# **按需手动触发**，不进 PR 路径（同 security-scan / pit-mutation 分工）。
# 为什么不定时：单次评测约 60 次真实模型调用（5–8 万 token），而代码不变时重复评测同一份代码
# 是纯开销 —— 从 nightly 收到 weekly 之后仍是一笔固定支出，改为「要出数字时才跑」。
# 什么时候跑：改 prompt / 换模型 / 调检索参数（分块、topK、RRF 的 k）/ 更新语料后跑一次，
# 结果是质量回归的直接证据；需要重新变成定期回归时把下面注释掉的 schedule 加回来即可。
# 判定两条：Judge 均分不得低于「基线 4.0 - 容忍 0.3」，且评审覆盖率必须 ≥ 80%
# （覆盖率不达标说明多数用例没跑成功，均分是「幸存者平均」，不构成质量结论）。
# 阈值单一来源是 eval/baselines.yaml，本文件的数字只是复述。
#
# Secret：EASYORANGE_AI_API_KEY —— 同时注入 ChatModel 与 EmbeddingModel：
#   同一个 key 兼作两者仅在「同一平台同时提供 chat 与 embedding」时成立（如百炼 compatible-mode：
#   DeepSeek 系列 chat + text-embedding-v3）。若只配了纯 chat 供应商的 key，
#   embedding bean 会退化为 UnconfiguredEmbeddingModel，检索指标走 MySQL LIKE 降级路径。
# 供应商可换：DEEPSEEK_BASE_URL / DEEPSEEK_MODEL 由仓库变量提供，缺省仍是 DeepSeek 官方端点。
on:
  # 需要定期回归时加回（原为每周一 03:30，与 PIT 02:30 错峰）：
  #   schedule:
  #     - cron: '30 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# 评测会产生真实 API 费用，禁止并发实例叠加；不 cancel-in-progress（不打断已计费的运行）
concurrency:
  group: ai-eval-${{ github.ref }}
  cancel-in-progress: false

env:
  EASYORANGE_AI_API_KEY: ${{ secrets.EASYORANGE_AI_API_KEY }}
  DEEPSEEK_API_KEY: ${{ secrets.EASYORANGE_AI_API_KEY }}
  EMBEDDING_API_KEY: ${{ secrets.EASYORANGE_AI_API_KEY }}
  # 云厂商托管的 DeepSeek 模型与官方端点线协议一致，换供应商只改这两个仓库变量
  DEEPSEEK_BASE_URL: ${{ vars.EASYORANGE_AI_BASE_URL || 'https://api.deepseek.com' }}
  DEEPSEEK_MODEL: ${{ vars.EASYORANGE_AI_MODEL || 'deepseek-chat' }}

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # key 缺失时 @EnabledIfEnvironmentVariable 会把 IT 静默跳过 → 门禁空转变绿；
      # 显式守卫把「忘配 secret」变成可见失败而不是假绿。
      - name: Guard API key secret
        if: ${{ env.EASYORANGE_AI_API_KEY == '' }}
        run: |
          echo "::error::secret EASYORANGE_AI_API_KEY 未配置：Settings → Secrets and variables → Actions"
          exit 1

      - name: Setup JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # 分两步（同 pit-mutation 模式）：先 install 上游模块（-DskipTests 跳过执行、保留编译），
      # 再对 application 单模块跑 failsafe——避免整仓单测重跑，信号聚焦评测门禁。
      - name: Build upstream modules (skip tests)
        run: ./mvnw -pl easyorange-application -am install -DskipTests -B
        working-directory: easyorange-backend

      # 检索指标必须有 ES：金标准集的 gold_doc_ids 按 ES 索引设计（dense_vector kNN + BM25 排名融合，
      # 语料含同域干扰文档，命中不是必然）。无 ES 时 KnowledgeRetrievalService 降级为 MySQL LIKE
      # （只命中关键词字面重叠，其注释自陈「仅保证可用不保证召回质量」），
      # hit@5 必然大幅下滑、断言失败 —— 这个失败是「测的是降级路径而非产品检索」的正确信号。
      # 时序无抖动：种子文档 R__seed_knowledge_docs 以 status=PENDING 入库，
      # KnowledgeBootstrapIndexer（ApplicationRunner，同步执行）在上下文启动阶段完成补索引。
      - name: Start Elasticsearch (IK)
        run: docker compose --profile search up -d --wait elasticsearch

      # 基础设施由 spring-boot-docker-compose 按仓库根 compose.yaml（start-only）拉起
      # mysql/redis/rabbitmq（runner 自带 Docker）。测试内 Boot 默认跳过 compose
      # （spring.docker.compose.skip.in-tests 默认 true），必须显式关闭，否则容器不启动、
      # IT 连接 localhost 失败——见 application-it.yaml。
      #
      # 必须走 verify 生命周期而非直接调 failsafe 目标：surefire/failsafe 的 argLine 里含
      # @{argLine} 晚绑定占位符，由 jacoco:prepare-agent（绑定 initialize）赋值；
      # 直接调 failsafe:integration-test 时该占位符不解析，JVM 以「could not open '{argLine}'」启动失败。
      # 本模块单测规模小，跑完整 verify 的代价可接受。
      - name: Golden set regression gate
        env:
          SPRING_DOCKER_COMPOSE_SKIP_IN_TESTS: "false"
        run: ./mvnw -pl easyorange-application verify -Dit.test=GoldenSetRegressionIT -Deasyorange.search.elasticsearch.enabled=true -B
        working-directory: easyorange-backend

      # 门禁红时把判定依据捞出来：Judge 分、评审覆盖率、hit@5/MRR、逐用例结果都在失败报告里，
      # 靠翻页找数字正是此前门禁红了数周没人看清的直接原因。
      - name: Upload failsafe reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: failsafe-reports
          path: |
            easyorange-backend/easyorange-application/target/failsafe-reports/
            easyorange-backend/easyorange-application/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14
