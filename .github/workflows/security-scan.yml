name: Security scan (OWASP)

# 慢扫描不进 PR 门禁：nightly + 手动触发，结果在 Actions 面板供人工观察。
# 原 push/PR 触发已移除 —— 该 job 非阻断，每次 push 白跑只是浪费 runner 时间。
# 真实 CVSS≥8 告警会让 job 标红（pom -Powasp 的 failOnError=false 只吞 NVD 拉取失败，
# 不吞真实告警）；NVD 抖动导致的失败不会影响 merge（不在此 workflow 的门禁路径上）。
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owasp:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # NVD 数据目录跨 run 复用，避免每次重下整库。key 必须每 run 唯一：命中时不回写，
      # 静态 key 会让库永久冻在首次写入那天，扫描照常通过却看不见新 CVE。
      # 拆 restore / save 两步而非一步式 actions/cache：后者的 save-always 已被官方废弃且
      # 不生效（实测告警），失败 run 仍不回写 —— 而扫描报红恰恰最需要留住更新后的库。
      - name: Restore OWASP NVD data
        id: nvd-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.dependency-check-data
          key: ${{ runner.os }}-owasp-nvd-${{ github.run_number }}
          # 无尾横线，前缀匹配才同时命中存量 key 与新 key，首次 run 拿旧库当种子免重下整库
          restore-keys: ${{ runner.os }}-owasp-nvd

      # verify -Powasp：仅激活 OWASP dependency-check（NVD 漏洞扫描），reactor 含全部后端模块，
      # 依赖树从 reactor 解析，无需先 install。-DskipTests=true 跳过测试执行（测试编译仍发生）
      - name: OWASP dependency-check (NVD)
        run: ./mvnw verify -B -Powasp -DskipTests=true
        working-directory: easyorange-backend
        env:
          # pom 的 nvdApiKeyEnvironmentVariable 指定读这个名字。不写成 -D 参数：会进日志
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      # 缺 key / NVD 不可达时插件只 WARNING 后回落旧库、job 照样绿，这道库龄校验把静默失效变成报警。
      # 阈值 7 天：容忍连续几天的 NVD 抖动（pom 的 failOnError=false 就是为此留的），拦住冻结数月。
      - name: Assert NVD data not stale
        run: |
          newest=$(find ~/.dependency-check-data -type f -printf '%T@\n' | sort -rn | head -1 | cut -d. -f1)
          age_days=$(( ( $(date +%s) - newest ) / 86400 ))
          echo "NVD 数据最近写入：${age_days} 天前"
          if [ "$age_days" -gt 7 ]; then
            echo "::error::NVD 数据已 ${age_days} 天未更新，本次扫描结果可能遗漏新公开的 CVE"
            exit 1
          fi

      # if: always() —— 扫描报红时也要回写，否则每次失败 run 都白做一遍增量拉取
      - name: Save OWASP NVD data
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.dependency-check-data
          key: ${{ steps.nvd-cache.outputs.cache-primary-key }}
