name: Security scan (OWASP)

# 慢扫描不进 PR 门禁：nightly + 手动触发，结果在 Actions 面板供人工观察。
# 原 push/PR 触发已移除 —— 该 job 非阻断，每次 push 白跑只是浪费 runner 时间。
# 真实 CVSS≥8 告警会让 job 标红（pom -Powasp 的 failOnError=false 只吞 NVD 拉取失败，
# 不吞真实告警）；NVD 抖动导致的失败不会影响 merge（不在此 workflow 的门禁路径上）。
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owasp:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # OWASP dependency-check 的 NVD 数据目录 —— 稳定 key 跨 run 复用，避免每次全新下载整库
      - name: Cache OWASP NVD data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.dependency-check-data
          key: ${{ runner.os }}-owasp-nvd

      # verify -Powasp：仅激活 OWASP dependency-check（NVD 漏洞扫描），reactor 含全 11 模块，
      # 依赖树从 reactor 解析，无需先 install。-DskipTests=true 跳过测试执行（测试编译仍发生）
      - name: OWASP dependency-check (NVD)
        run: ./mvnw verify -B -Powasp -DskipTests=true
        working-directory: easyorange-backend
