name: PIT mutation (nightly)

# PIT 变异测试（仅 order 模块 domain 层）—— 慢，nightly + 手动触发，不进 PR 路径。
# 结果供人工观察变异覆盖率趋势，不阻塞 merge。
on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # 仅 order 模块（domain 变异基线最高 ~70%），避免全仓 PIT 分钟级耗时。
      # 分两步：先 install 上游依赖模块，再对 order 单独跑 PIT —— 若用 `-am` 一步跑，
      # pitest:mutationCoverage 直接 goal 会在 reactor 内每个上游模块（common/framework/
      # product/user/payment）上各跑一遍，耗时数分钟且偏离"仅 order"意图。
      - name: Build upstream modules (skip PIT)
        run: ./mvnw -pl easyorange-order -am install -DskipTests -B
        working-directory: easyorange-backend

      - name: PIT mutation coverage (order domain)
        run: ./mvnw -pl easyorange-order -Ppit test-compile pitest:mutationCoverage -B
        working-directory: easyorange-backend
