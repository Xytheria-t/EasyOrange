name: Maven Test

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 后端门禁：全量 11 模块单测 + verify（JaCoCo 覆盖率 80%/60% + Spotless 格式）。
  # 快、稳定，是唯一 merge-freeze 后端闸门。OWASP / PIT 这两个慢或网络脆的扫描拆出去单独跑（见下）。
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('easyorange-backend/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # 全量 11 模块测试（取代原先只测 framework/application/admin 三模块）
      - name: Backend full test (11 modules)
        run: ./mvnw test -B
        working-directory: easyorange-backend

      # verify -Pci：JaCoCo check（80% 行/60% 分支）+ Spotless 格式检查。任一红 → merge-freeze。
      # OWASP 已移出 -Pci：NVD 在境外 runner 上太脆（首次扫描实测 39 分钟），改由下方非阻断 security job 承担
      - name: Backend verify (JaCoCo + Spotless gates)
        run: ./mvnw verify -B -Pci -DskipTests=true
        working-directory: easyorange-backend

  # OWASP 漏洞扫描（dependency-check + NVD）— 独立非阻断 job。NVD 在境外 runner 上慢/脆：
  # 首次扫描实测 39 分钟，若放主门禁会阻塞每次 push/PR，且随时因 NVD 抖动让 CI 红。
  # continue-on-error=true → 只暴露扫描结果供人工观察，不 merge-freeze；
  # failOnError=false（pom -Powasp）→ NVD 拉取失败只告警不标红，仅真实 CVSS≥8 告警会把 job 标红。
  security:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('easyorange-backend/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # OWASP dependency-check 的 NVD 数据目录 —— 稳定 key 跨 run 复用，避免每次全新下载整库
      - name: Cache OWASP NVD data
        uses: actions/cache@v4
        with:
          path: ~/.dependency-check-data
          key: ${{ runner.os }}-owasp-nvd

      # verify -Powasp：仅激活 OWASP dependency-check（NVD 漏洞扫描），reactor 含全 11 模块，
      # 依赖树从 reactor 解析，无需先 install。-DskipTests=true 跳过测试执行（测试编译仍发生）
      - name: OWASP dependency-check (NVD)
        run: ./mvnw verify -B -Powasp -DskipTests=true
        working-directory: easyorange-backend

  # 前端门禁：并行于 backend，独立完即报绿。lint + 单测 + typecheck + 生产构建 + Playwright E2E。
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: easyorange-frontend/package-lock.json

      - name: Install frontend dependencies
        # 强制官方 registry + 全局替换 lockfile 里的 npmmirror host：避免 CI 从
        # registry.npmmirror.com 拉包遇 503（该镜像在境外 runner 上不稳定）
        run: npm ci --registry=https://registry.npmjs.org --replace-registry-host=always
        working-directory: easyorange-frontend

      - name: Lint check
        run: npm run lint:check
        working-directory: easyorange-frontend

      - name: Run frontend tests
        run: npm test
        working-directory: easyorange-frontend

      - name: Typecheck
        run: npm run typecheck
        working-directory: easyorange-frontend

      # 生产构建：tsc + vite build（rolldown），验证产物可生成；同时产出 dist 供下方 E2E 使用
      - name: Frontend production build
        run: npm run build
        working-directory: easyorange-frontend

      # E2E（Playwright）—— 纯 mock 双 Token 会话恢复流，跑在 vite preview（生产构建产物
      # dist，由上方 build 步骤产出），不依赖后端。代码更新 → 已跑过的 E2E 自动重跑：
      # 前端组件/路由/data-testid/文案变更会被立刻捕获。
      # 若 CI 环境出现偶发抖动，可降级 continue-on-error 观察（不建议，会失去门禁意义）
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
        working-directory: easyorange-frontend

      - name: Run E2E tests
        run: npx playwright test
        working-directory: easyorange-frontend

  # PIT 变异测试 — 评估测试对缺陷的真实检测力（仅 domain 层）。非阻断：
  # continue-on-error=true 使其不拖慢/不阻塞主门禁，仅暴露变异覆盖趋势供人工观察。
  pit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # 仅 order 模块（domain 变异基线最高 ~70%），避免全仓 PIT 分钟级耗时。
      # 分两步：先 install 上游依赖模块，再对 order 单独跑 PIT —— 若用 `-am` 一步跑，
      # pitest:mutationCoverage 直接 goal 会在 reactor 内每个上游模块（common/framework/
      # product/user/payment）上各跑一遍，耗时数分钟且偏离"仅 order"意图。
      - name: Build upstream modules (skip PIT)
        run: ./mvnw -pl easyorange-order -am install -DskipTests -B
        working-directory: easyorange-backend

      - name: PIT mutation coverage (order domain)
        run: ./mvnw -pl easyorange-order -Ppit test-compile pitest:mutationCoverage -B
        working-directory: easyorange-backend
