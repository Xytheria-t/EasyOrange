#-------------------------------------------------------------------------------#
#            Discover all capabilities of Qodana in our documentation           #
#             https://www.jetbrains.com/help/qodana/about-qodana.html           #
#-------------------------------------------------------------------------------#

name: Qodana
# 只在后端 Java 变更的 PR（pr-mode 仅分析变更文件）+ 手动触发运行。
# 不配 push：全量扫描无 baseline 会把存量警告（当前 44 个）当 "new problems" 刷屏 develop，
# 而 PR 变更文件分析已能拦住回归。Qodana 非 required check，pull_request 配 paths 无
# required-check 陷阱（该陷阱仅限 required check），只改前端/工作流的 PR 不白跑 JVM 分析。
# 需要全量体检时用 workflow_dispatch 手动触发。
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'easyorange-backend/**'

jobs:
  qodana:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: 'Qodana Scan'
        uses: JetBrains/qodana-action@4861e015da555e86a72b862892aba6c2b93e6891 # v2026.1.3
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
        with:
          # pr-mode=true：PR 事件只分析变更文件（快、只报新增问题）
          pr-mode: true
          use-caches: true
          post-pr-comment: true
          use-annotations: true
          # Upload Qodana results (SARIF, other artifacts, logs) as an artifact to the job
          upload-result: false
          # quick-fixes available in Ultimate and Ultimate Plus plans
          push-fixes: 'none'