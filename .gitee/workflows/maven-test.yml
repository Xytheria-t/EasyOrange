name: Maven Test

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('easyorange-backend/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # 全量 11 模块测试（取代原先只测 framework/application/admin 三模块）
      - name: Backend full test (11 modules)
        run: ./mvnw test -B
        working-directory: easyorange-backend

      # verify -Pci：激活 OWASP dependency-check（NVD 漏洞扫描）+ JaCoCo check（80% 行/60% 分支）
      # 任一红 → merge-freeze。PIT 变异测试单独在 pit job 跑（非阻断，避免拖慢主门禁）
      - name: Backend verify (OWASP + JaCoCo gates)
        run: ./mvnw verify -B -Pci -DskipTests=true
        working-directory: easyorange-backend

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: easyorange-frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: easyorange-frontend

      - name: Lint check
        run: npm run lint:check
        working-directory: easyorange-frontend

      - name: Run frontend tests
        run: npm test
        working-directory: easyorange-frontend

      - name: Typecheck
        run: npm run typecheck
        working-directory: easyorange-frontend

      # 生产构建：tsc + vite build（rolldown），验证产物可生成
      - name: Frontend production build
        run: npm run build
        working-directory: easyorange-frontend

  # PIT 变异测试 — 评估测试对缺陷的真实检测力（仅 domain 层）。非阻断：
  # continue-on-error=true 使其不拖慢/不阻塞主门禁，仅暴露变异覆盖趋势供人工观察。
  pit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # 仅 order 模块（domain 变异基线最高 ~70%），避免全仓 PIT 分钟级耗时
      - name: PIT mutation coverage (order domain)
        run: ./mvnw -pl easyorange-order -am -Ppit test-compile pitest:mutationCoverage -B -DskipTests=false
        working-directory: easyorange-backend
