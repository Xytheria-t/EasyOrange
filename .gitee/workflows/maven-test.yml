name: Maven Test

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('easyorange-backend/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # 全量 11 模块测试（取代原先只测 framework/application/admin 三模块）
      - name: Backend full test (11 modules)
        run: ./mvnw test -B
        working-directory: easyorange-backend

      # verify 阶段启用 JaCoCo 门禁（Gitee 不跑 PIT 节省时间）
      - name: Backend verify (JaCoCo gate)
        run: ./mvnw verify -B -Djacoco.haltOnFailure=true -DskipTests=true
        working-directory: easyorange-backend

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: easyorange-frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: easyorange-frontend

      - name: Lint check
        run: npm run lint:check
        working-directory: easyorange-frontend

      - name: Run frontend tests
        run: npm test
        working-directory: easyorange-frontend
