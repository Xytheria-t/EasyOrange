name: Build Docker Image

on:
  push:
    branches:
      - develop

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build backend JAR
        run: ./mvnw clean package -DskipTests -pl easyorange-application -am
        working-directory: easyorange-backend

      - name: Build and push backend Docker image
        run: |
          docker build -t easyorange-backend:${{ github.sha }} -f easyorange-backend/Dockerfile .
          docker tag easyorange-backend:${{ github.sha }} easyorange-backend:latest
          # Uncomment and configure when Docker registry credentials are available
          # docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }} ${{ secrets.DOCKER_REGISTRY }}
          # docker push easyorange-backend:${{ github.sha }}
          # docker push easyorange-backend:latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: easyorange-frontend/package-lock.json

      - name: Build frontend
        run: |
          npm ci
          npm run build
        working-directory: easyorange-frontend

      - name: Build and push frontend Docker image
        run: |
          docker build -t easyorange-frontend:${{ github.sha }} -f easyorange-frontend/Dockerfile .
          docker tag easyorange-frontend:${{ github.sha }} easyorange-frontend:latest
          # Uncomment and configure when Docker registry credentials are available
          # docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }} ${{ secrets.DOCKER_REGISTRY }}
          # docker push easyorange-frontend:${{ github.sha }}
          # docker push easyorange-frontend:latest
