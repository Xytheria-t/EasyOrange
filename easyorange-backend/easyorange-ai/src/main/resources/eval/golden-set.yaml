# ===================================================================
# EasyOrange 金标准评测集（Golden Set）
# 用途：评估进 CI — Judge 回归打分 + 检索指标（hit@5 / MRR）采样
# 结构：
#   id              用例 ID（chat-* 生成质量 / retr-* 检索质量）
#   scope           场景，取值必须是 chat 或 retrieval（GoldenSetLoader 强校验，写错直接启动失败）
#   question        用户问题
#   reference_answer Judge 对照参考（scope: chat 必须有）
#   gold_doc_ids    期望命中的知识库文档 ID（scope: retrieval 必须有，引用 R__seed_knowledge_docs.sql）
# 维护：新增/修改用例走 PR，分数回归对比见 eval/baselines.yaml
# 注意：id 是稳定标识，删除用例后不重编号（重编号会让历史评测结果对不上），因此 id 允许有洞
# 注意：检索用例的 gold 文档必须与同域干扰文档（kb-0006~kb-0025）可区分 ——
#      语料与 topK 同量级时 hit@5 恒为 100%，指标就成了装饰。
# ===================================================================
cases:
  # ---- 生成质量（chat + 知识库引用溯源）----
  - id: chat-001
    scope: chat
    question: 平台交易流程是什么？
    reference_answer: 交易流程：浏览商品下单、卖家确认后买家付款、卖家发货、买家确认收货、平台担保放款，平台不接触货物。
    gold_doc_ids: [kb-0001]
  - id: chat-002
    scope: chat
    question: 我怎么申请退款？
    reference_answer: 未发货可申请全额退款；已发货未签收可申请退款并拦截物流；签收后 7 天内支持无理由退货，商品需保持完好。
    gold_doc_ids: [kb-0002]
  - id: chat-003
    scope: chat
    question: 运费由谁承担？
    reference_answer: 默认买家承担；卖家可设满额包邮；无理由退货退货运费买家承担，质量问题退货卖家承担。
    gold_doc_ids: [kb-0003]
  - id: chat-005
    scope: chat
    question: 平台能卖烟酒吗？
    reference_answer: 不能。烟酒、处方药、医疗器械等特许经营商品禁售；虚拟物品仅限话费充值、游戏点卡等白名单品类。
    gold_doc_ids: [kb-0005]
  - id: chat-006
    scope: chat
    question: 下单后什么时候发货？
    reference_answer: 卖家确认订单后买家付款，随后卖家安排发货，买家在物流签收后确认收货，平台担保放款。
    gold_doc_ids: [kb-0001]
  - id: chat-007
    scope: chat
    question: 签收后还能退吗？
    reference_answer: 签收后 7 天内支持无理由退货，退回商品需保持完好、不影响二次销售；质量问题可申诉，平台介入仲裁。
    gold_doc_ids: [kb-0002]
  - id: chat-009
    scope: chat
    question: 商品有质量问题退货谁出运费？
    reference_answer: 因商品质量问题或描述不符导致的退货，退货运费由卖家承担；无理由退货由买家承担。
    gold_doc_ids: [kb-0003]
  - id: chat-010
    scope: chat
    question: 二手手机能卖吗？
    reference_answer: 可以。二手手机、数码、书籍、服饰等个人闲置物品可正常发布，但需如实描述成色与瑕疵。
    gold_doc_ids: [kb-0005]
  # ---- 生成质量（chat 通用，无知识库引用）----
  - id: chat-011
    scope: chat
    question: 你好，你是谁？
    reference_answer: 我是 EasyOrange 平台 AI 助手，可以回答平台交易、退款、运费等规则问题。
  - id: chat-012
    scope: chat
    question: 你能做什么？
    reference_answer: 我可以解答平台规则问题（交易流程、退款、运费、禁售品类），也能陪你闲聊。
  - id: chat-013
    scope: chat
    question: 谢谢你的帮助
    reference_answer: 不客气，有需要随时问我。
  - id: chat-014
    scope: chat
    question: 今天天气怎么样？
    reference_answer: 抱歉，我无法获取实时天气信息，建议查看天气 App。
  - id: chat-015
    scope: chat
    question: 什么是 AI？
    reference_answer: AI 是人工智能，指让机器模拟人类智能的技术，比如自然语言处理、图像识别等。
  - id: chat-016
    scope: chat
    question: 你能推荐一下买什么类型的数码产品吗？
    reference_answer: 可以按预算和用途推荐，比如手机、平板、耳机，请告诉我你的预算和偏好。
  - id: chat-017
    scope: chat
    question: 在吗？
    reference_answer: 在的，有什么可以帮你？
  - id: chat-018
    scope: chat
    question: 这个平台是什么？
    reference_answer: EasyOrange 是 C2C 资产流转平台，买卖双方直接交易，平台提供担保、仲裁与 AI 智能服务。
  - id: chat-019
    scope: chat
    question: 你会写代码吗？
    reference_answer: 我可以提供代码思路和示例，但更擅长解答 EasyOrange 平台相关问题。
  - id: chat-020
    scope: chat
    question: 再见
    reference_answer: 再见，有需要随时回来找我。
  - id: chat-021
    scope: chat
    question: 支付失败了怎么办？
    reference_answer: 支付失败常见原因是余额不足、超出限额或风控拦截，可稍后重试或改用其他渠道；平台支持微信支付、支付宝与银行卡三种渠道。
    gold_doc_ids: [kb-0006]
  - id: chat-022
    scope: chat
    question: 一件商品最多能传几张图片？
    reference_answer: 单件商品最多上传 9 张图片，首图须为商品主体实拍，图片不得含水印、二维码或联系方式；另可上传 1 段不超过 60 秒的展示视频。
    gold_doc_ids: [kb-0020]
