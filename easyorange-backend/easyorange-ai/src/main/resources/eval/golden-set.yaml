  # ---- 发布链路路由（listing，多步工具循环）：卖家线索 → 禁售查证 → 品类召回 → 行情统计 → finish ----
  # 这是本集第一批多步用例：此前 19 条 chat 路由用例只有 knowledge_search / finish 两种取值，
  # 7 步上限、60% 冗余收敛、STEP_LIMIT 降级、轮间观察回填全部没被自己的语料执行过，路由门禁
  # 实际只测了「该不该检索」的二元分类。发布链路的每步输入依赖上一步输出，多步路径必须标全。
  # 评估跑批无图片：question 即卖家线索文本，从 runToolLoop 的 seller_note 进决策上下文。
  - id: list-001
    scope: listing
    question: 索尼 A7M3 微单相机，九成新单机身，快门两万次，想挂个合理价出掉
    expected_tools: [knowledge_search, product_search, market_price_stats, finish]
  - id: list-002
    scope: listing
    question: ThinkPad X1 Carbon 笔记本，i7 处理器 32G 内存，用了五年，屏幕有轻微划痕
    expected_tools: [knowledge_search, product_search, market_price_stats, finish]
  - id: list-003
