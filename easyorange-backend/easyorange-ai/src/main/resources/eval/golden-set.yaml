# ===================================================================
# EasyOrange 金标准评测集（Golden Set）
# 用途：评估进 CI — Judge 回归打分 + 检索指标（hit@5 / MRR）采样 + 路由准确率
# 结构：
#   id              用例 ID（chat-* 生成质量 / retr-* 检索质量）
#   scope           场景，取值必须是 chat 或 retrieval（GoldenSetLoader 强校验，写错直接启动失败）
#   question        用户问题
#   reference_answer Judge 对照参考（scope: chat 必须有）
#   gold_doc_ids    期望命中的知识库文档 ID（scope: retrieval 必须有，引用 R__seed_knowledge_docs.sql）
#   expected_tools  期望模型走过的工具（scope: chat 可选，路由准确率用）：规则类问题标
#                   knowledge_search，寒暄与能力问答这类无需检索的标 finish，取值取自 AgentTools 的工具名
# 维护：新增/修改用例走 PR，分数回归对比见 eval/baselines.yaml
# 注意：id 是稳定标识，删除用例后不重编号（重编号会让历史评测结果对不上），因此 id 允许有洞
# 注意：检索用例的 gold 文档必须与同域干扰文档（kb-0006~kb-0035）可区分 ——
#      语料与 topK 同量级时 hit@5 恒为 100%，指标就成了装饰。
# 注意：expected_tools 只标「正确路径唯一」的用例 —— 该不该检索本身有多种合理走法时
#      （如「能推荐买什么数码吗」可以先反问预算也可以直接检索）就不标，标了等于把合理波动算成回归。
# ===================================================================
cases:
  # ---- 生成质量（chat + 知识库引用溯源）----
  - id: chat-001
    scope: chat
    question: 平台交易流程是什么？
    reference_answer: 交易流程：浏览商品下单、卖家确认后买家付款、卖家发货、买家确认收货、平台担保放款，平台不接触货物。
    expected_tools: [knowledge_search]
    gold_doc_ids: [kb-0001]
  - id: chat-002
    scope: chat
    question: 我怎么申请退款？
    reference_answer: 未发货可申请全额退款；已发货未签收可申请退款并拦截物流；签收后 7 天内支持无理由退货，商品需保持完好。
    expected_tools: [knowledge_search]
    gold_doc_ids: [kb-0002]
  - id: chat-003
    scope: chat
    question: 运费由谁承担？
    reference_answer: 默认买家承担；卖家可设满额包邮；无理由退货退货运费买家承担，质量问题退货卖家承担。
    expected_tools: [knowledge_search]
    gold_doc_ids: [kb-0003]
  - id: chat-005
    scope: chat
    question: 平台能卖烟酒吗？
    reference_answer: 不能。烟酒、处方药、医疗器械等特许经营商品禁售；虚拟物品仅限话费充值、游戏点卡等白名单品类。
    expected_tools: [knowledge_search]
    gold_doc_ids: [kb-0005]
  - id: chat-006
    scope: chat
    question: 下单后什么时候发货？
    reference_answer: 卖家确认订单后买家付款，随后卖家安排发货，买家在物流签收后确认收货，平台担保放款。
    expected_tools: [knowledge_search]
    gold_doc_ids: [kb-0001]
  - id: chat-007
    scope: chat
    question: 签收后还能退吗？
    reference_answer: 签收后 7 天内支持无理由退货，退回商品需保持完好、不影响二次销售；质量问题可申诉，平台介入仲裁。
    expected_tools: [knowledge_search]
    gold_doc_ids: [kb-0002]
  - id: chat-009
    scope: chat
    question: 商品有质量问题退货谁出运费？
    reference_answer: 因商品质量问题或描述不符导致的退货，退货运费由卖家承担；无理由退货由买家承担。
    expected_tools: [knowledge_search]
    gold_doc_ids: [kb-0003]
  - id: chat-010
    scope: chat
    question: 二手手机能卖吗？
    reference_answer: 可以。二手手机、数码、书籍、服饰等个人闲置物品可正常发布，但需如实描述成色与瑕疵。
    expected_tools: [knowledge_search]
    gold_doc_ids: [kb-0005]
  # ---- 生成质量（chat 通用，无知识库引用）----
  - id: chat-011
    scope: chat
    question: 你好，你是谁？
    reference_answer: 我是 EasyOrange 平台 AI 找货助手，可以帮你在在售资产里找货，也能回答平台交易、退款、运费等规则问题。
    expected_tools: [finish]
  - id: chat-012
    scope: chat
    question: 你能做什么？
    reference_answer: 我可以帮你在在售资产里找货（说预算、品类、用途），解答平台规则问题（交易流程、退款、运费、禁售品类），也能陪你闲聊。
  - id: chat-013
    scope: chat
    question: 谢谢你的帮助
    reference_answer: 不客气，有需要随时问我。
    expected_tools: [finish]
  - id: chat-014
    scope: chat
    question: 今天天气怎么样？
    reference_answer: 抱歉，我无法获取实时天气信息，建议查看天气 App。
    expected_tools: [finish]
  - id: chat-015
    scope: chat
    question: 什么是 AI？
    reference_answer: AI 是人工智能，指让机器模拟人类智能的技术，比如自然语言处理、图像识别等。
    expected_tools: [finish]
  - id: chat-016
    scope: chat
    question: 你能推荐一下买什么类型的数码产品吗？
    reference_answer: 可以按预算和用途推荐，比如手机、平板、耳机，请告诉我你的预算和偏好。
  - id: chat-017
    scope: chat
    question: 在吗？
    reference_answer: 在的，有什么可以帮你？
    expected_tools: [finish]
  - id: chat-018
    scope: chat
    question: 这个平台是什么？
    reference_answer: EasyOrange 是 C2C 资产流转平台，买卖双方直接交易，平台提供担保、仲裁与 AI 智能服务。
  - id: chat-019
    scope: chat
    question: 你会写代码吗？
    reference_answer: 我可以提供代码思路和示例，但更擅长解答 EasyOrange 平台相关问题。
    expected_tools: [finish]
  - id: chat-020
    scope: chat
    question: 再见
    reference_answer: 再见，有需要随时回来找我。
    expected_tools: [finish]
  - id: chat-021
    scope: chat
    question: 支付失败了怎么办？
    reference_answer: 支付失败常见原因是余额不足、超出限额或风控拦截，可稍后重试或改用其他渠道；平台支持微信支付、支付宝与银行卡三种渠道。
    expected_tools: [knowledge_search]
    gold_doc_ids: [kb-0006]
  - id: chat-022
    scope: chat
    question: 一件商品最多能传几张图片？
    reference_answer: 单件商品最多上传 9 张图片，首图须为商品主体实拍，图片不得含水印、二维码或联系方式；另可上传 1 段不超过 60 秒的展示视频。
    expected_tools: [knowledge_search]
    gold_doc_ids: [kb-0020]
  - id: chat-023
    scope: chat
    question: 预算 3000 买二手 iPhone，我该怎么验机？
    reference_answer: 按验机清单来：对照描述核对成色与外观，纯色背景下查屏幕坏点，查看电池健康度，检查进水标颜色；通话、Wi-Fi、蓝牙、面容、摄像头逐项实测，最后用序列号在官网核对型号与维修记录。
    expected_tools: [knowledge_search]
    gold_doc_ids: [kb-0031]
  - id: chat-024
    scope: chat
    question: 线下面交怎么防止被骗？
    reference_answer: 面交也走平台下单付款，担保到确认收货才放款；约在白天公共场所当面验货后再确认收货；拒绝脱离平台私下转账与站外联系，警惕索要验证码、要求屏幕共享的假客服。
    expected_tools: [knowledge_search]
    gold_doc_ids: [kb-0026]
