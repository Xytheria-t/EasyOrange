# ===================================================================
# EasyOrange 金标准质量基线（Baselines）
# 用途：评估门禁（EvalGate）的全部对比基准与阈值 —— 分数低于「基线 - 容忍度」、
#       评审覆盖率不足、hit@5 或路由准确率低于下限，任一不达标即卡 build
# 口径：分数为 golden-set.yaml 对应 scope 用例的 Judge 平均分（1-5）
# 维护：跑 GoldenSetRegressionIT 得到新基线后经评审更新本文件（分数只允许合理波动，不追高分）；
#       阈值缺失会在加载期直接报错，不落回内置默认值 —— 门禁悄悄放松比加载失败危险
# ===================================================================
generation:
  # chat 用例的 Judge 平均分基线
  score-baseline: 4.0
  # 允许低于基线的幅度：A/B 改造后下滑超过 0.3 分即判回归
  score-tolerance: 0.3
  # 评审覆盖率下限：低于 80% 说明均分只是「幸存者平均」，不能当质量结论
  min-coverage: 0.8

retrieval:
  # hit@5 下限：语料含同域干扰文档后命中不再是必然，低于一半说明召回质量退化
  min-hit-at-5: 0.5

routing:
  # 路由准确率下限（chat 单步用例）：标了 expected_tools 的 chat 用例里，实际路径命中全部期望工具的
  # 占比。与生成分门禁互补 —— 答案可能靠知识库兜底答对，但选错工具只有独立看路径才量得到。
  # 19 条用例的取值只有 knowledge_search / finish 两种，本质是「该不该检索」的二元分类，0.7 按它标定。
  # chat 与 listing 分开设阈值：两条链路难度不同型，混进一个分母会让多步用例稀释单步门槛（或反之）
  min-accuracy: 0.7
  # 路由准确率下限（listing 多步用例）：正常品类必须走全 禁售查证 → 品类召回 → 行情统计 → finish，
  # 含两个有依赖关系的轮次（召回在统计之前），合理上限天然低于单步二元分类，取 0.6 先验设定。
  # 待补口径：0.6 是发布链路多步化时的先验值，首次真实跑批（需 EASYORANGE_AI_API_KEY）后按实际
  # 分布重标 —— 全对说明门禁太松、大面积挂在同一轮则先修决策器 prompt 再谈阈值
  listing-min-accuracy: 0.6
