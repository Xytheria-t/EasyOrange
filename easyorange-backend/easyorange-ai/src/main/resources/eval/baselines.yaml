# ===================================================================
# EasyOrange 金标准质量基线（Baselines）
# 用途：评估门禁（EvalGate）的全部对比基准与阈值 —— 分数低于「基线 - 容忍度」、
#       评审覆盖率不足、hit@5 低于下限，任一不达标即卡 build
# 口径：分数为 golden-set.yaml 对应 scope 用例的 Judge 平均分（1-5）
# 维护：跑 GoldenSetRegressionIT 得到新基线后经评审更新本文件（分数只允许合理波动，不追高分）；
#       阈值缺失会在加载期直接报错，不落回内置默认值 —— 门禁悄悄放松比加载失败危险
# ===================================================================
generation:
  # chat 用例的 Judge 平均分基线
  score-baseline: 4.0
  # 允许低于基线的幅度：A/B 改造后下滑超过 0.3 分即判回归
  score-tolerance: 0.3
  # 评审覆盖率下限：低于 80% 说明均分只是「幸存者平均」，不能当质量结论
  min-coverage: 0.8

retrieval:
  # hit@5 下限：语料含同域干扰文档后命中不再是必然，低于一半说明召回质量退化
  min-hit-at-5: 0.5
