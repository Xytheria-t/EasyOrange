spring:
  main:
    banner-mode: off
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
  flyway:
    enabled: false
  jackson:
    serialization:
      write-dates-as-timestamps: false

logging:
  level:
    root: WARN

jwt:
  secret-key: test-secret-key-at-least-32-characters-long-for-testing
  access-token-expiration: 120
  refresh-token-expiration: 7
  token-prefix: "Bearer "
  issuer: easyorange-test

security:
  ignore-paths:
    - /api/auth/login
    - /api/auth/logout
    - /api/auth/refresh
    - /api/auth/sms-code
    - /api/auth/register
    - /api/auth/password-reset
    - /api/health
    - /openapi/**
    - /swagger-ui/**
  product-paths: []
  static-paths:
    - /static/**
    - /public/**
    - /upload/**
    - /favicon.ico
    - /error
  allowed-origins: "http://localhost:5173"

thread-pool:
  core-pool-size: 2
  max-pool-size: 4
  queue-capacity: 50
  keep-alive-seconds: 30
  thread-name-prefix: test-async-
