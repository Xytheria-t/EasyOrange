# 集成测试 profile（AbstractIntegrationTest 激活）— 复用项目 docker compose 的基础设施容器
# （MySQL / Redis / RabbitMQ），但连**独立库 easyorange_it**：测试残留与 dev 演示库物理隔离
# （TD-001），dev 库永远只有种子与运行期演示数据。
# 前置：dev 三件套需已运行（`docker compose up -d`）——测试内 Boot 默认跳过 compose
# （spring.docker.compose.skip.in-tests 默认 true），下方配置在本地不生效；
# CI 的 ai-eval.yml（按需 dispatch）显式置 SPRING_DOCKER_COMPOSE_SKIP_IN_TESTS=false 才由 Boot 拉起。
# 应用连接使用下方显式 localhost 直连（compose 把容器端口发布到宿主机，凭据与 compose.yaml 一致）。
# 相比 Testcontainers：不依赖 ryuk sidecar 镜像（无代理 Docker 拉取失败会让用例静默跳过，掩盖真实装配错误）。
spring:
  datasource:
    # 与 application.yaml 同参，仅库名换 easyorange_it；建库授权见 infra/mysql/init/01-easyorange-it.sql
    # （新卷由 entrypoint 执行；存量卷由 scripts/db-reset.sh 幂等补执行），Flyway 首跑自动建表
    url: jdbc:mysql://${EASYORANGE_DB_HOST:localhost}:${EASYORANGE_DB_PORT:3306}/${EASYORANGE_IT_DB_NAME:easyorange_it}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&connectTimeout=5000&socketTimeout=30000&connectionCollation=utf8mb4_0900_ai_ci
    username: ${EASYORANGE_DB_USERNAME:easyorange_app}
    password: ${EASYORANGE_DB_PASSWORD:easyorange_app_dev}
    driver-class-name: com.mysql.cj.jdbc.Driver

  docker:
    compose:
      # 相对应用目录：easyorange-application/ → 仓库根 compose.yaml（start-only 只保证运行、不销毁 dev 栈）
      file: ../../compose.yaml
      lifecycle-management: start-only
      # 只启 dev 依赖三件套，跳过 easyorange-app/prometheus/grafana：
      # 否则每次 mvn verify 都会构建后端镜像（2-5 分钟）+ 抢 8080/9090/3000 端口
      services:
        - mysql
        - redis
        - rabbitmq

  flyway:
    # 关校验：开发期改 V1 后 checksum 会挡启动（与 dev 关校验同一原因），IT 库随 reset 重建；
    # 干净库/CI 仍走默认校验。隔离已由 easyorange_it 独立库达成，不再依赖「复用 dev 库历史 diverged」。
    validate-on-migrate: false

  data:
    redis:
      # 与 compose.yaml 的 REDIS_* 默认值同源（compose.yaml 已改为读根 .env 插值）
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:easyorange123}
    elasticsearch:
      repositories:
        enabled: false      # 集成测试不校验 ES（easyorange.search.elasticsearch.enabled 基文件已 false）

  rabbitmq:
    # 与 compose.yaml 的 RABBITMQ_* 默认值同源（compose.yaml 已改为读根 .env 插值）
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:easyorange}
    password: ${RABBITMQ_PASSWORD:easyorange123}

management:
  tracing:
    sampling:
      probability: 0        # 测试不采样，避免向 Zipkin 发送 span

easyorange:
  ai:
    # 默认空 → 装配 placeholder bean，无 key 也能启动（与生产降级契约一致）；
    # 但必须写成 ${EMBEDDING_API_KEY:} 而非字面 ""：字面空串会压过环境变量，
    # 使 IT 永远拿不到 embedding key —— 知识库分块会退化成 text-only 入库（无 dense_vector），
    # kNN 检索 0 命中，GoldenSetRegressionIT 的 hit@5 恒为 0。
    embedding:
      api-key: ${EMBEDDING_API_KEY:}