# 集成测试 profile（AbstractIntegrationTest 激活）— 复用项目 docker compose 的 dev 基础设施。
# 前置：dev 三件套需已运行（`docker compose up -d`）——测试内 Boot 默认跳过 compose
# （spring.docker.compose.skip.in-tests 默认 true），下方配置在本地不生效；
# CI 的 ai-eval.yml（按需 dispatch）显式置 SPRING_DOCKER_COMPOSE_SKIP_IN_TESTS=false 才由 Boot 拉起。
# 应用连接使用下方显式 localhost 直连（compose 把容器端口发布到宿主机，凭据与 compose.yaml 一致）。
# 相比 Testcontainers：不依赖 ryuk sidecar 镜像（无代理 Docker 拉取失败会让用例静默跳过，掩盖真实装配错误）。
spring:
  docker:
    compose:
      # 相对应用目录：easyorange-application/ → 仓库根 compose.yaml（start-only 只保证运行、不销毁 dev 栈）
      file: ../../compose.yaml
      lifecycle-management: start-only
      # 只启 dev 依赖三件套，跳过 easyorange-app/prometheus/grafana：
      # 否则每次 mvn verify 都会构建后端镜像（2-5 分钟）+ 抢 8080/9090/3000 端口
      services:
        - mysql
        - redis
        - rabbitmq

  flyway:
    # 复用开发者 dev 库时，其迁移历史可能与当前脚本 diverged（repeatable seed 曾被移除过）。
    # 本 profile 关闭校验：IT 是装配/连通性冒烟，不承担迁移校验职责；干净库/CI 仍走默认校验。
    validate-on-migrate: false

  data:
    redis:
      # 与 compose.yaml 的 REDIS_* 默认值同源（compose.yaml 已改为读根 .env 插值）
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:easyorange123}
    elasticsearch:
      repositories:
        enabled: false      # 集成测试不校验 ES（easyorange.search.elasticsearch.enabled 基文件已 false）

  rabbitmq:
    # 与 compose.yaml 的 RABBITMQ_* 默认值同源（compose.yaml 已改为读根 .env 插值）
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:easyorange}
    password: ${RABBITMQ_PASSWORD:easyorange123}

management:
  tracing:
    sampling:
      probability: 0        # 测试不采样，避免向 Zipkin 发送 span

easyorange:
  ai:
    # 默认空 → 装配 placeholder bean，无 key 也能启动（与生产降级契约一致）；
    # 但必须写成 ${EMBEDDING_API_KEY:} 而非字面 ""：字面空串会压过环境变量，
    # 使 IT 永远拿不到 embedding key —— 知识库分块会退化成 text-only 入库（无 dense_vector），
    # kNN 检索 0 命中，GoldenSetRegressionIT 的 hit@5 恒为 0。
    embedding:
      api-key: ${EMBEDDING_API_KEY:}