# ===================================================================
# Spring Boot 开发环境配置文件
# ===================================================================
# 说明：仅包含与主配置不同的开发环境特定设置
# 激活方式：spring.profiles.active=dev（已在 application.yaml 中设置）
# ===================================================================

spring:
  # -------------------------------------------------------------------
  # 数据源配置 - 开发环境使用较小的连接池
  # -------------------------------------------------------------------
  datasource:
    password: ${EASYORANGE_DB_PASSWORD:easyorange_app_dev}  # 通过项目专用环境变量设置，开发环境默认本地应用账号密码
    hikari:
      maximum-pool-size: 10               # 开发环境最大连接数
      minimum-idle: 3                     # 开发环境最小空闲连接数
      connection-init-sql: SET NAMES utf8mb4

  # -------------------------------------------------------------------
  # Flyway 配置 - 开发环境额外加载测试数据
  # -------------------------------------------------------------------
  flyway:
    locations: classpath:db/migration,classpath:db/dev
    # 开发环境允许 out-of-order，便于团队协作时合并迁移
    out-of-order: true

  # -------------------------------------------------------------------
  # SQL 初始化配置 - 加载种子数据
  # 说明：种子数据通过 Flyway Repeatable 迁移加载，此处仅作备用
  # -------------------------------------------------------------------
  sql:
    init:
      mode: never  # 使用 Flyway 管理数据初始化，不使用 Spring Boot 默认的 data.sql

  # -------------------------------------------------------------------
  # Redis 配置 - 开发环境使用较小的连接池
  # -------------------------------------------------------------------
  data:
    redis:
      lettuce:
        pool:
          min-idle: 3                   # 开发环境最小空闲连接数
          max-idle: 10                  # 开发环境最大空闲连接数
          max-active: 10                # 开发环境最大活跃连接数

# -------------------------------------------------------------------
# 日志配置 - 开发环境
# -------------------------------------------------------------------
logging:
  level:
    root: INFO
    com.cartethyia.easyorange: INFO
    com.cartethyia.easyorange.payment.application.event: DEBUG
    com.cartethyia.easyorange.payment.application: DEBUG
    com.cartethyia.easyorange.order.application: DEBUG
    com.cartethyia.easyorange.product.application: DEBUG
    com.cartethyia.easyorange.user.application: DEBUG
    com.baomidou.mybatisplus: WARN
    org.mybatis: WARN
    org.springframework.boot: INFO
    org.springframework.web: WARN
    org.springframework.data: WARN
    com.zaxxer.hikari: WARN
    io.lettuce: WARN
    org.apache: WARN

# -------------------------------------------------------------------
# 文件上传配置
# -------------------------------------------------------------------
file:
  upload:
    path: ./upload                        # 文件上传路径
    url-prefix: /api/file/                # 文件访问 URL 前缀

# -------------------------------------------------------------------
# 图片处理配置
# -------------------------------------------------------------------
easyorange:
  file:
    image:
      quality: 0.80
      thumbnail-quality: 0.75
      responsive-quality: 0.75
      progressive-jpeg:
        enabled: true
        min-size: 102400
      smart-crop:
        enabled: true
        default-aspect-ratio: 1:1
        min-entropy-threshold: 0.5

# -------------------------------------------------------------------
# JWT Token 配置
# -------------------------------------------------------------------
jwt:
  secret-key: ${JWT_SECRET_KEY:dev-secret-key-for-easyorange-must-be-at-least-32-chars}  # JWT 密钥，开发环境默认值，生产环境必须通过环境变量 JWT_SECRET_KEY 设置强密钥
  access-token-expiration: 120            # Access Token 过期时间（分钟）
  refresh-token-expiration: 7             # Refresh Token 过期时间（天）
  token-prefix: "Bearer "                 # Token 前缀
  issuer: easyorange                      # Token 发行者

# -------------------------------------------------------------------
# Actuator 监控端点配置
# -------------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

# -------------------------------------------------------------------
# 速率限制器配置 - 开发环境启用但使用更高阈值
# -------------------------------------------------------------------
rate-limiter:
  enabled: true  # 开发环境启用速率限制，使用更高阈值便于测试
  default-limit: 1000  # 开发环境使用更高的限制
