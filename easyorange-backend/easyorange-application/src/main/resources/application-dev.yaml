# ===================================================================
# Spring Boot 开发环境配置文件
# ===================================================================
# 说明：仅包含与主配置不同的开发环境特定设置
# 激活方式：spring.profiles.active=dev（已在 application.yaml 中设置）
#
# ⚠️  安全警告 ⚠️
# 本文件包含开发环境专用的默认密码和密钥，仅用于本地开发测试。
# 这些默认值绝不应用于生产环境！生产环境必须通过环境变量提供安全凭证。
# ===================================================================

spring:
  # -------------------------------------------------------------------
  # 数据源配置 - 开发环境使用较小的连接池
  # -------------------------------------------------------------------
  datasource:
    password: ${EASYORANGE_DB_PASSWORD:easyorange_app_dev}  # 通过项目专用环境变量设置，开发环境默认本地应用账号密码
    hikari:
      maximum-pool-size: 10               # 开发环境最大连接数
      minimum-idle: 3                     # 开发环境最小空闲连接数
      connection-init-sql: SET NAMES utf8mb4

  # -------------------------------------------------------------------
  # Flyway 配置 - 开发环境额外加载测试数据
  # -------------------------------------------------------------------
  flyway:
    locations: classpath:db/migration,classpath:db/dev
    out-of-order: false

  # -------------------------------------------------------------------
  # SQL 初始化配置 - 加载种子数据
  # 说明：种子数据通过 Flyway Repeatable 迁移加载，此处仅作备用
  # -------------------------------------------------------------------
  sql:
    init:
      mode: never  # 使用 Flyway 管理数据初始化，不使用 Spring Boot 默认的 data.sql

  # -------------------------------------------------------------------
  # Redis 配置 - 开发环境使用较小的连接池
  # ⚠️ 警告: 默认密码仅用于本地开发，生产环境必须通过环境变量设置
  # -------------------------------------------------------------------
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:easyorange123}  # ⚠️ 仅限开发环境使用
      lettuce:
        pool:
          min-idle: 3                   # 开发环境最小空闲连接数
          max-idle: 10                  # 开发环境最大空闲连接数
          max-active: 10                # 开发环境最大活跃连接数

  # -------------------------------------------------------------------
  # RabbitMQ 消息队列配置 - 开发环境
  # ⚠️ 警告: 默认密码仅用于本地开发，生产环境必须通过环境变量设置
  # -------------------------------------------------------------------
  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBITMQ_USER:easyorange}  # ⚠️ 仅限开发环境使用
    password: ${RABBITMQ_PASSWORD:easyorange123}  # ⚠️ 仅限开发环境使用
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      type: simple
      simple:
        acknowledge-mode: auto
        prefetch: 10
        concurrent-consumers: 1
        max-concurrent-consumers: 5
        default-requeue-rejected: false

# -------------------------------------------------------------------
# 日志配置 - 开发环境
# -------------------------------------------------------------------
logging:
  level:
    root: INFO
    com.cartethyia.easyorange: INFO
    com.cartethyia.easyorange.payment.application.event: DEBUG
    com.cartethyia.easyorange.payment.application: DEBUG
    com.cartethyia.easyorange.order.application: DEBUG
    com.cartethyia.easyorange.product.application: DEBUG
    com.cartethyia.easyorange.user.application: DEBUG
    com.cartethyia.easyorange.ai.config: WARN
    com.cartethyia.easyorange.framework.config.web: WARN
    com.baomidou.mybatisplus: WARN
    org.mybatis: WARN
    org.springframework.boot.devtools: WARN
    org.springframework.boot.web.servlet.context: WARN
    org.springframework.boot.actuate.endpoint.web: WARN
    org.springframework.boot: INFO
    org.springframework.web: WARN
    org.springframework.data: WARN
    com.zaxxer.hikari: WARN
    io.lettuce: WARN
    org.apache: WARN

# -------------------------------------------------------------------
# 文件上传配置
# -------------------------------------------------------------------
file:
  upload:
    path: ./upload                        # 文件上传路径
    url-prefix: /api/file/                # 文件访问 URL 前缀

# -------------------------------------------------------------------
# 图片处理配置
# -------------------------------------------------------------------
easyorange:
  file:
    image:
      quality: 0.80
      thumbnail-quality: 0.75
      responsive-quality: 0.75
      progressive-jpeg:
        enabled: true
        min-size: 102400
      smart-crop:
        enabled: true
        default-aspect-ratio: 1:1
        min-entropy-threshold: 0.5

  # -------------------------------------------------------------------
  # RabbitMQ 消息队列配置 - 自定义业务配置
  # -------------------------------------------------------------------
  rabbitmq:
    enabled: true
    exchange: eo.domain.events
    routing-key-prefix: ""
    publisher:
      confirms: true
      returns: true
      retry:
        enabled: true
        max-attempts: 3
        initial-interval: 1s
        multiplier: 2
    consumer:
      prefetch: 10
      default-requeue-rejected: false
      concurrency:
        min: 1
        max: 5

# -------------------------------------------------------------------
# JWT Token 配置
# ⚠️⚠️⚠️ 严重安全警告 ⚠️⚠️⚠️
# 以下 JWT 密钥默认值仅用于本地开发环境，绝对不可用于生产环境！
# 生产环境必须通过环境变量 JWT_SECRET_KEY 设置强密钥（至少256位）。
# 使用默认密钥在生产环境将导致严重的安全漏洞（令牌伪造、身份冒充等）。
# -------------------------------------------------------------------
jwt:
  secret-key: ${JWT_SECRET_KEY:dev-key-change-in-prod-easyorange-at-least-32-chars}  # ⚠️ 仅限开发环境！生产环境必须设置环境变量
  access-token-expiration: 120            # Access Token 过期时间（分钟）
  refresh-token-expiration: 7             # Refresh Token 过期时间（天）
  token-prefix: "Bearer "                 # Token 前缀
  issuer: easyorange                      # Token 发行者

# -------------------------------------------------------------------
# Actuator 监控端点配置
# -------------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

# -------------------------------------------------------------------
# 限流配置 - 开发环境使用更高阈值便于测试
# -------------------------------------------------------------------
rate-limit-filter:
  enabled: true
  rules:
    - path-pattern: /api/products
      method: GET
      strategy: local
      max-requests: 1000
      window-seconds: 60
    - path-pattern: /api/products/{id}
      method: GET
      strategy: local
      max-requests: 1000
      window-seconds: 60
    - path-pattern: /api/products/categories/**
      method: GET
      strategy: local
      max-requests: 1000
      window-seconds: 60
    - path-pattern: /api/**
      method: [POST, PUT, DELETE, PATCH]
      strategy: redis
      max-requests: 1000
      window-seconds: 60
  repeat-submit:
    enabled: true
    interval-ms: 3000
