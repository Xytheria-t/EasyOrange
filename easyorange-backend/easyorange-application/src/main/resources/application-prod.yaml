# ===================================================================
# Spring Boot 生产环境配置文件
# ===================================================================
# 说明：生产环境特定配置
# 激活方式：spring.profiles.active=prod
# ===================================================================

spring:
  # -------------------------------------------------------------------
  # 数据源配置 - 生产环境使用高可用配置
  # -------------------------------------------------------------------
  datasource:
    password: ${EASYORANGE_DB_PASSWORD}
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-init-sql: SET NAMES utf8mb4
      # 生产环境必须启用 SSL
      ssl-mode: VERIFY_IDENTITY

  # -------------------------------------------------------------------
  # Redis 配置 - 生产环境使用安全的连接配置
  # -------------------------------------------------------------------
  data:
    redis:
      ssl: true
      lettuce:
        pool:
          min-idle: 10
          max-idle: 50
          max-active: 100

  # -------------------------------------------------------------------
  # 文件上传配置 - 生产环境限制更严格
  # -------------------------------------------------------------------
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 5MB

# -------------------------------------------------------------------
# 日志配置
# -------------------------------------------------------------------
logging:
  level:
    root: WARN
    com.cartethyia.easyorange: INFO

# -------------------------------------------------------------------
# 文件上传配置
# -------------------------------------------------------------------
file:
  upload:
    path: /var/easyorange/uploads
    url-prefix: /api/file/

# -------------------------------------------------------------------
# JWT Token 配置 - 生产环境
# -------------------------------------------------------------------
jwt:
  secret-key: ${JWT_SECRET_KEY}
  access-token-expiration: 60
  refresh-token-expiration: 7
  token-prefix: "Bearer "
  issuer: easyorange

# -------------------------------------------------------------------
# Actuator 监控端点配置 - 生产环境限制暴露
# -------------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

# -------------------------------------------------------------------
# 安全配置 - 生产环境更严格
# -------------------------------------------------------------------
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  servlet:
    context-path: /
  http2:
    enabled: true
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
    min-response-size: 1024

# -------------------------------------------------------------------
# 限流配置 - 生产环境使用更严格的阈值
# -------------------------------------------------------------------
rate-limit-filter:
  enabled: true
  rules:
    - path-pattern: /api/products
      method: GET
      strategy: local
      max-requests: 100
      window-seconds: 60
    - path-pattern: /api/products/{id}
      method: GET
      strategy: local
      max-requests: 100
      window-seconds: 60
    - path-pattern: /api/products/categories/**
      method: GET
      strategy: local
      max-requests: 100
      window-seconds: 60
    - path-pattern: /api/**
      method: [POST, PUT, DELETE, PATCH]
      strategy: redis
      max-requests: 20
      window-seconds: 60
  repeat-submit:
    enabled: true
    interval-ms: 3000

security:
  ignore-paths:
    - /api/auth/login
    - /api/auth/logout
    - /api/auth/refresh
    - /api/auth/sms-code
    - /api/auth/register
    - /api/auth/password-reset
    - /api/health
    - /api/products/{id}/view
    - /api/products/batch
  product-paths:
    - /api/products
    - /api/products/{id}
    - /api/products/categories/**
    - /api/products/search
    - /api/products/{id}/similar
  static-paths:
    - /static/**
    - /public/**
    - /upload/**
    - /api/file/**
    - /favicon.ico
    - /error
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

# 生产环境 API 文档已关闭
