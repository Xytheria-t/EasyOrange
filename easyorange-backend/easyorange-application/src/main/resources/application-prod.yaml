# ===================================================================
# Spring Boot 生产环境配置文件
# ===================================================================
# 说明：生产环境特定配置
# 激活方式：spring.profiles.active=prod
# ===================================================================

spring:
  # -------------------------------------------------------------------
  # 启动期优化: 关 JMX + 关 banner
  # -------------------------------------------------------------------
  jmx:
    enabled: false
  main:
    banner-mode: off

  # -------------------------------------------------------------------
  # 数据源配置 - 生产环境使用高可用配置
  # 注意: host 无默认值, 必须通过环境变量提供, 防止误连开发数据库
  # -------------------------------------------------------------------
  datasource:
    url: jdbc:mysql://${EASYORANGE_DB_HOST}:${EASYORANGE_DB_PORT:3306}/${EASYORANGE_DB_NAME:easyorange}?useUnicode=true&characterEncoding=UTF-8&useSSL=true&serverTimezone=Asia/Shanghai&connectTimeout=5000&socketTimeout=30000&connectionCollation=utf8mb4_0900_ai_ci&allowPublicKeyRetrieval=false&verifyServerCertificate=true
    username: ${EASYORANGE_DB_USERNAME}
    password: ${EASYORANGE_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-init-sql: SET NAMES utf8mb4

  # -------------------------------------------------------------------
  # Redis 配置 - 生产环境使用安全的连接配置
  # -------------------------------------------------------------------
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      ssl: true
      lettuce:
        pool:
          min-idle: 10
          max-idle: 50
          max-active: 100

  # -------------------------------------------------------------------
  # 文件上传配置 - 生产环境限制更严格
  # -------------------------------------------------------------------
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 5MB

  # -------------------------------------------------------------------
  # RabbitMQ 消息队列配置 - 生产环境
  # -------------------------------------------------------------------
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
    publisher-returns: true

# -------------------------------------------------------------------
# 日志配置
# -------------------------------------------------------------------
logging:
  level:
    root: WARN
    com.cartethyia.easyorange: INFO

# -------------------------------------------------------------------
# 文件上传配置
# -------------------------------------------------------------------
file:
  upload:
    path: /var/easyorange/uploads
    url-prefix: /api/file/

# -------------------------------------------------------------------
# JWT Token 配置 - 生产环境
# -------------------------------------------------------------------
jwt:
  private-key-location: ${JWT_RSA_PRIVATE_KEY}
  public-key-location: ${JWT_RSA_PUBLIC_KEY}
  access-token-expiration: 60
  refresh-token-expiration: 7
  issuer: easyorange
  refresh-cookie-secure: true            # 生产 HTTPS 必须 Secure

# -------------------------------------------------------------------
# Actuator 监控端点配置 - 生产环境限制暴露
# -------------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,rabbit
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}

# -------------------------------------------------------------------
# 安全配置 - 生产环境更严格
# -------------------------------------------------------------------
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  servlet:
    context-path: /
  http2:
    enabled: true
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
    min-response-size: 1024

# -------------------------------------------------------------------
# 限流配置 - 生产环境使用更严格的阈值
# -------------------------------------------------------------------
rate-limit-filter:
  enabled: true
  rules:
    - path-pattern: /api/products
      method: GET
      strategy: local
      max-requests: 100
      window-seconds: 60
    - path-pattern: /api/products/{id}
      method: GET
      strategy: local
      max-requests: 100
      window-seconds: 60
    - path-pattern: /api/products/categories/**
      method: GET
      strategy: local
      max-requests: 100
      window-seconds: 60
    - path-pattern: /api/**
      method: [POST, PUT, DELETE, PATCH]
      strategy: redis
      max-requests: 20
      window-seconds: 60
  repeat-submit:
    enabled: true
    interval-ms: 3000

security:
  ignore-paths:
    - /api/auth/login
    - /api/auth/refresh
    - /api/auth/sms-code
    - /api/auth/register
    - /api/auth/password-reset
    - /api/health
    - /api/products/{id}/view
    - /api/products/batch
    # WebSocket 握手端点 — 由 WebSocketAuthInterceptor 自行完成 JWT 认证与吊销校验
    - /ws
    - /ws/**
  product-paths:
    - /api/products
    - /api/products/{id}
    - /api/products/categories/**
    - /api/products/search
    - /api/products/{id}/similar
  static-paths:
    - /static/**
    - /public/**
    - /upload/**
    - /api/file/**
    - /favicon.ico
    - /error
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}

# 生产环境 API 文档已关闭
