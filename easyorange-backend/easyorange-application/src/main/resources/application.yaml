spring:
  application:
    name: EasyOrange

  profiles:
    active: dev

  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ss
    time-zone: Asia/Shanghai

  main:
    banner-mode: console

  datasource:
    url: jdbc:mysql://${EASYORANGE_DB_HOST:localhost}:${EASYORANGE_DB_PORT:3306}/${EASYORANGE_DB_NAME:easyorange}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&connectTimeout=5000&socketTimeout=30000&connectionCollation=utf8mb4_0900_ai_ci
    username: ${EASYORANGE_DB_USERNAME:easyorange_app}
    password: ${EASYORANGE_DB_PASSWORD:easyorange_app_dev}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      validation-timeout: 3000
      pool-name: HikariCP-EasyOrange
      leak-detection-threshold: 60000
      connection-init-sql: SET NAMES utf8mb4

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 10000ms

      lettuce:
        pool:
          min-idle: 5
          max-idle: 20
          max-active: 20
          max-wait: 3000ms

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  aop:
    proxy-target-class: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    clean-disabled: true
    table: flyway_schema_history
    placeholder-replacement: false
    out-of-order: false
    ignore-migration-patterns: '*:ignored'

  lifecycle:
    timeout-per-shutdown-phase: 90s

server:
  port: 8080
  shutdown: graceful
  servlet:
    context-path: /
  trusted-proxies: ${SERVER_TRUSTED_PROXIES:127.0.0.1,localhost,0:0:0:0:0:0:0:1}

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-handlers-package: com.cartethyia.easyorange.framework.config.database
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-field: delFlag
      logic-delete-value: 2
      logic-not-delete-value: 0
  pagination:
    enabled: true
    db-type: mysql
    max-limit: 100
    overflow: false
    optimize-join: true
  optimistic-lock:
    enabled: true

logging:
  level:
    root: INFO
    com.cartethyia.easyorange: INFO
    org.springframework: WARN
    org.springframework.aop.framework.CglibAopProxy: ERROR

thread-pool:
  core-pool-size: 10
  max-pool-size: 20
  queue-capacity: 100
  keep-alive-seconds: 60
  thread-name-prefix: async-

webmvc:
  exclude-paths:
    - /static/**
    - /public/**
    - /upload/**
    - /api/file/**
    - /favicon.ico
    - /error
    - /actuator/**
  skip-logging-paths:
    - /api/health
    - /api/stats/platform
    - /actuator/**
    - /api/file/**
  interceptor-order: 0

security:
  ignore-paths:
    - /api/auth/login
    - /api/auth/logout
    - /api/auth/refresh
    - /api/auth/sms-code
    - /api/auth/register
    - /api/auth/password-reset
    - /api/health
    - /api/stats/platform
    - /openapi/**
    - /swagger-ui/**
    - /swagger-ui.html
    - /api/products/{id}/view
    - /api/products/batch
    - /api/products/categories/cache
  product-paths:
    - /api/products
    - /api/products/{id}
    - /api/products/categories/**
    - /api/products/search
    - /api/products/search/**
    - /api/products/{id}/similar
    - /api/products/{id}/reviews
    - /api/products/{id}/reviews/stats
  static-paths:
    - /static/**
    - /public/**
    - /upload/**
    - /api/file/**
    - /favicon.ico
    - /error
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176,http://localhost:5177,http://localhost:5178,http://localhost:3000,http://127.0.0.1:5173}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    url: /openapi/spec
    tags-sorter: alpha
    operations-sorter: alpha
