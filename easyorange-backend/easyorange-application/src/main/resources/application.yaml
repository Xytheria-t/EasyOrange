spring:
  application:
    name: EasyOrange

  profiles:
    active: dev

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  main:
    banner-mode: console

  datasource:
    url: jdbc:mysql://${EASYORANGE_DB_HOST:localhost}:${EASYORANGE_DB_PORT:3306}/${EASYORANGE_DB_NAME:easyorange}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&connectTimeout=5000&socketTimeout=30000
    username: ${EASYORANGE_DB_USERNAME:easyorange_app}
    password: ${EASYORANGE_DB_PASSWORD:easyorange_app_dev}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      validation-timeout: 3000
      pool-name: HikariCP-EasyOrange
      leak-detection-threshold: 60000
      connection-init-sql: SET NAMES utf8mb4

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 10000ms

      lettuce:
        pool:
          min-idle: 5
          max-idle: 20
          max-active: 20
          max-wait: 3000ms

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  aop:
    proxy-target-class: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true
    table: flyway_schema_history

server:
  port: 8080
  shutdown: graceful
  servlet:
    context-path: /

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-field: delFlag
      logic-delete-value: 2
      logic-not-delete-value: 0

logging:
  level:
    root: INFO
    com.cartethyia.easyorange: INFO
    org.springframework: WARN
    org.springframework.aop.framework.CglibAopProxy: ERROR

thread-pool:
  core-pool-size: 10
  max-pool-size: 20
  queue-capacity: 100
  keep-alive-seconds: 60
  thread-name-prefix: async-

security:
  ignore-paths:
    - /api/auth/login
    - /api/auth/logout
    - /api/auth/refresh
    - /api/users/register
    - /api/users/forgotPassword
    - /api/users/auth/miniprogram/**
    - /api/health
    - /v3/api-docs/**
    - /swagger-ui/**
    - /swagger-ui.html
  product-paths:
    - /api/products
    - /api/products/{id}
    - /api/products/categories/**
    - /api/products/search
    - /api/products/{id}/similar
    - /api/products/batch
    - /api/products/{id}/view
  static-paths:
    - /static/**
    - /public/**
    - /upload/**
    - /favicon.ico
    - /error
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  info:
    title: EasyOrange API
    description: 校园二手交易平台 API 文档
    version: 0.0.1
    contact:
      name: cartethyia
