spring:
  application:
    name: EasyOrange

  profiles:
    active: dev

  threads:
    virtual:
      enabled: true

  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ss
    time-zone: Asia/Shanghai

  main:
    banner-mode: console

  ai:
    # 模型由 easyorange-ai 的 AiModelConfig 手动装配（DeepSeek/Qwen-VL/Embedding），
    # 且不使用 audio/image/moderation 模型族，故整体禁用 Spring AI OpenAI 自动配置，
    # 避免无 AI key 时这些自动装配模型在启动期强制校验凭据而崩溃
    model:
      chat: false
      embedding: false
      audio.speech: false
      audio.transcription: false
      image: false
      moderation: false

    # MCP server — 公开只读工具面（streamable HTTP，端点 /mcp，工具 4 个）。
    # 外部 MCP client（Cursor / Claude Desktop）无用户上下文：只暴露在售资产检索/详情、
    # 类目、平台规则知识，不含用户态数据与写路径（信任边界见根 AGENTS.md）
    mcp:
      server:
        name: easyorange
        version: "1.0.0"
        # protocol 必须显式写：EnabledStreamableServerCondition 读 Environment 而非属性对象，
        # 属性默认值（streamable）不进 Environment，缺省时传输端点整个不装配（实测 404）
        protocol: streamable
        instructions: >-
          EasyOrange 二手交易平台的公开只读工具面：在售资产检索与详情、类目浏览、
          平台规则知识检索。不含用户态数据与写路径。
        capabilities:
          prompt: false
          resource: false
          completion: false

  datasource:
    url: jdbc:mysql://${EASYORANGE_DB_HOST:localhost}:${EASYORANGE_DB_PORT:3306}/${EASYORANGE_DB_NAME:easyorange}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&connectTimeout=5000&socketTimeout=30000&connectionCollation=utf8mb4_0900_ai_ci
    username: ${EASYORANGE_DB_USERNAME:easyorange_app}
    password: ${EASYORANGE_DB_PASSWORD:easyorange_app_dev}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      validation-timeout: 3000
      pool-name: HikariCP-EasyOrange
      leak-detection-threshold: 60000
      connection-init-sql: SET NAMES utf8mb4

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}  # 无默认值，由各 profile 提供
      database: 0
      timeout: 10000ms

      lettuce:
        pool:
          min-idle: 5
          max-idle: 20
          max-active: 20
          max-wait: 3000ms

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  aop:
    proxy-target-class: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    clean-disabled: true
    table: flyway_schema_history
    placeholder-replacement: false
    out-of-order: false
    ignore-migration-patterns: '*:ignored'

  elasticsearch:
    uris: ${ES_URIS:http://localhost:9200}
    connection-timeout: 5s
    socket-timeout: 30s

  # RabbitMQ 监听容器 — 消费端容器由 Boot 自动装配（rabbitListenerContainerFactory），
  # 本段为全部 profile 共享的容器行为默认值（dev/prod/it 继承，可局部覆盖）
  rabbitmq:
    listener:
      type: simple
      simple:
        acknowledge-mode: auto
        prefetch: 10
        concurrency: 1
        max-concurrency: 5
        default-requeue-rejected: false
        retry:
          enabled: true
          max-retries: 2        # 重试 2 次 + 首次投递 = 共 3 次尝试
          initial-interval: 1s
          multiplier: 2
          max-interval: 10s

  lifecycle:
    timeout-per-shutdown-phase: 90s

# -------------------------------------------------------------------
# Idempotency-Key 幂等配置（Filter 驱动，替代 @Idempotent AOP 切面）
# 仅对写方法 + 命中路径的请求生效；非 2xx 响应不缓存，允许客户端重试
# -------------------------------------------------------------------
idempotency:
  enabled: true
  header-name: "Idempotency-Key"
  path-patterns:
    - /api/orders
    - /api/products
    - /api/payments
  methods: [POST, PUT, PATCH]

# -------------------------------------------------------------------
# 限流 + 防重提交配置（Filter 驱动，替代 AOP 切面）
# -------------------------------------------------------------------
rate-limit-filter:
  enabled: true
  rules:
    # 商品浏览 — GET 走本地限流，零网络开销
    - path-pattern: /api/products
      method: GET
      strategy: local
      max-requests: 200
      window-seconds: 60
      message: "请求过于频繁，请稍后重试"
    - path-pattern: /api/products/{id}
      method: GET
      strategy: local
      max-requests: 200
      window-seconds: 60
      message: "请求过于频繁，请稍后重试"
    - path-pattern: /api/products/categories/**
      method: GET
      strategy: local
      max-requests: 200
      window-seconds: 60
      message: "请求过于频繁，请稍后重试"
    # 通用写操作 — Redis 分布式限流
    - path-pattern: /api/**
      method: [POST, PUT, DELETE, PATCH]
      strategy: redis
      max-requests: 30
      window-seconds: 60
      message: "操作过于频繁，请稍后重试"
    # MCP 工具面 — 公开匿名端点（不在 /api 下，需单独限流）
    - path-pattern: /mcp
      method: POST
      strategy: redis
      max-requests: 60
      window-seconds: 60
      message: "请求过于频繁，请稍后重试"
  repeat-submit:
    enabled: true
    interval-ms: 3000
    message: "不允许重复提交"
    methods: [POST, PUT, DELETE, PATCH]
    # MCP 端点豁免 — JSON-RPC 超时重试复用同一请求体，防重会拒绝协议内合法重试
    exclude-path-patterns:
      - /mcp

server:
  port: 8080
  shutdown: graceful
  servlet:
    context-path: /

# -------------------------------------------------------------------
# SpringDoc OpenAPI 3 — 自动生成 API 契约文档 + Swagger UI
# -------------------------------------------------------------------
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    doc-expansion: none
    persist-authorization: true
  default-flat-param-object: true

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.cartethyia.easyorange.product.adapter.outbound.persistence, com.cartethyia.easyorange.product.application.query
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    default-statement-timeout: 30
    # 枚举统一走 @EnumValue 注解字段持久化（MybatisEnumTypeHandler），不再手写 TypeHandler
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  global-config:
    banner: false
    db-config:
      logic-delete-field: delFlag
      # 与 BaseDO 的 @TableLogic(value="0", delval="1") 保持一致；全局值仅对未注解字段生效
      logic-delete-value: 1
      logic-not-delete-value: 0
# 分页与乐观锁拦截器由 framework 的 MybatisPlusConfig 装配，单页上限见 easyorange.mybatis-plus.max-limit

# -------------------------------------------------------------------
# 慢 SQL 检测（MyBatis 拦截器）
# -------------------------------------------------------------------
slow-sql:
  enabled: true
  threshold-ms: 500
  log-level: warn
  log-parameters: true
  metrics-enabled: true

management:
  # ES 健康指示器基文件关闭：prod 与默认 compose 三件套都不含 ES，基文件开着会让
  # /actuator/health 长期 DOWN（readiness 分组不含 elasticsearch，故就绪探针不受影响）。
  # 启用 ES 搜索的 profile（dev / it-es）已在各自文件里同步置回 true。
  health:
    elasticsearch:
      enabled: false
  tracing:
    sampling:
      # 本地全采样（Langfuse 面板需要完整 trace）；prod 由 TRACING_SAMPLING_PROBABILITY 覆盖
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          # Spring AI Observation → OTel SDK → OTLP → Langfuse 自托管（W3-4）。
          # host 端口 3001（3000 已被 Grafana 占用）；compose 内经同名变量改指 langfuse-web:3000。
          # Boot 的 HTTP exporter 对端点原样 POST，Langfuse 侧必须带信号子路径 /v1/traces，
          # 只配基路径 /api/public/otel 会 404。
          # Basic 值 = base64(public_key:secret_key)，与 .env 的 LANGFUSE_INIT_PROJECT_* 初始化键同源
          endpoint: ${LANGFUSE_OTLP_ENDPOINT:http://localhost:3001/api/public/otel/v1/traces}
          headers:
            # Basic 值 = base64(public_key:secret_key)，与 .env 的 LANGFUSE_INIT_PROJECT_* 初始化键同源
            Authorization: ${LANGFUSE_OTLP_BASIC_AUTH:Basic cGstbGYtZWFzeW9yYW5nZS1kZXY6c2stbGYtZWFzeW9yYW5nZS1kZXYtc2VjcmV0}
            # 不带 x-langfuse-ingestion-version: 4：v4 事件管道在自托管 compose 下 events_core
            # 不物化（实测 4.38.0），默认管道经 Redis 队列由 worker 消费，链路通、延迟秒级~1 分钟
            x-langfuse-ingestion-version: "4"
  otlp:
    metrics:
      export:
        # starter 会默认开 OTLP 指标上报（localhost:4318）；指标统一走 Prometheus，关掉防周期性 WARN
        enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,rabbit
  endpoint:
    health:
      show-details: when-authorized
      # 就绪/存活探针：/actuator/health/readiness + /actuator/health/liveness
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis,rabbit,ai
        liveness:
          include: livenessState

logging:
  level:
    root: INFO
    com.cartethyia.easyorange: INFO
    org.springframework: WARN
    org.springframework.aop.framework.CglibAopProxy: ERROR
    com.baomidou: WARN
    io.lettuce: WARN
    org.apache.ibatis: WARN



webmvc:
  exclude-paths:
    - /static/**
    - /public/**
    - /upload/**
    - /api/file/**
    - /favicon.ico
    - /error
    - /actuator/**
    # MCP streamable HTTP — GET /mcp 是长连 SSE 流，计入 http.server.request 会拖垮分位值口径
    - /mcp
  skip-logging-paths:
    - /actuator/**
    - /api/file/**
  interceptor-order: 0

security:
  ignore-paths:
    - /api/auth/login
    # 短信登录与密码登录同为「未登录状态下的换票入口」，漏放行会让匿名请求吃 401（登录页验证码 tab 恒失败）
    - /api/auth/sms-login
    - /api/auth/refresh
    - /api/auth/sms-code
    # 验证码预检（忘记密码第二步）— 匿名可达，爆破防护走 SmsCodePort 验证次数上限
    - /api/auth/sms-code/verify
    - /api/auth/register
    - /api/auth/password/reset
    - /api/products/{id}/view
    - /api/products/batch
    # 支付网关回调 — 匿名可达，安全性由 HMAC 签名校验承担（CallbackSignatureVerifier）
    - /api/payments/callback
    # Actuator 运维端点 — 仅放行健康/信息/指标抓取（探针与 Prometheus 需匿名访问）；
    # 其中的详细内容受 show-details: when-authorized 保护。env/configprops 等敏感端点不在暴露清单内
    - /actuator/health/**
    - /actuator/info
    - /actuator/prometheus
    - /actuator/metrics
    # WebSocket 握手端点 — 由 WebSocketAuthInterceptor 自行完成 JWT 认证与吊销校验
    - /ws
    - /ws/**
    # MCP 工具面 — 外部 MCP client 无用户上下文，匿名可达；安全性由「仅公开只读工具 +
    # 独立限流 + 防重豁免」的信任边界承担（见根 AGENTS.md）
    - /mcp
    # SpringDoc OpenAPI 3 — API 契约文档 + Swagger UI（仅开发/测试环境暴露，生产通过反向代理拦截）
    - /v3/api-docs/**
    - /swagger-ui/**
    - /swagger-ui.html
  product-paths:
    - /api/products
    - /api/products/{id}
    - /api/products/categories/**
    - /api/products/search
    - /api/products/search/**
    - /api/products/{id}/similar
  static-paths:
    - /static/**
    - /public/**
    - /upload/**
    - /api/file/**
    - /favicon.ico
    - /error
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176,http://localhost:5177,http://localhost:5178,http://localhost:3000,http://127.0.0.1:5173}

easyorange:
  validation:
    password:
      weak-list:
        - "Password1!"
        - "Password123!"
        - "Qwerty123!"
        - "Admin123!"
        - "Welcome1!"
        - "Letmein1!"
        - "Abc123!@"
        - "Test123!"
        - "Passw0rd!"
        - "P@ssw0rd!"
        - "Password!1"
        - "Admin@123"

  search:
    elasticsearch:
      enabled: false

  file:
    image:
      quality: 0.80
      thumbnail-quality: 0.75
      responsive-quality: 0.75
      progressive-jpeg:
        enabled: true
        min-size: 102400
      smart-crop:
        enabled: true
        # 必须加引号：YAML 会把裸写的 1:1 当六十进制整数解析成 61（4:3 → 243）
        default-aspect-ratio: "1:1"
        min-entropy-threshold: 0.5

  ai:
    # 四个模型槽位（决策 / 文本 / 视觉 / Embedding）的 api-key、base-url、model 都可经环境变量覆盖：
    # 各云厂商的 OpenAI 兼容端点（如百炼 compatible-mode）协议一致，换供应商只改环境变量、不动代码
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      model: ${DEEPSEEK_MODEL:deepseek-chat}
      # 工具决策专用模型（chat_tool 场景）— 纯路由任务配快模型，生成仍走上面的强模型；留空即同模型
      router-model: ${DEEPSEEK_ROUTER_MODEL:}
      timeout: 30000
    qwen-vl:
      api-key: ${QWEN_VL_API_KEY:}
      base-url: ${QWEN_VL_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      model: ${QWEN_VL_MODEL:qwen-vl-max}
      timeout: 60000
    embedding:
      api-key: ${EMBEDDING_API_KEY:}
      base-url: ${EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      model: ${EMBEDDING_MODEL:text-embedding-v3}
      # 必须与 ES 映射的 dims 一致（product-mapping.json / knowledge-mapping.json）；换模型要同步改映射并重建索引
      dimensions: 1024
      timeout: 30000
    cache:
      stale-max-size: 5000
      stale-expire-hours: 24
    rate-limit:
      enabled: true
      fail-open: true
    budget:
      enabled: true
      # 预算存储：memory（默认，单实例 / 开发）| redis（多实例共享日预算，口径与内存版一致）
      # 内存版每个实例各记各的 —— 多副本部署下日限会被放大 N 倍，生产多副本必须切 redis
      store: memory
      # 按场景配置 token 预算 — 覆盖 @TokenBudget 注解默认值，运维可热更新而无需发版
      # scenario 键与 AiCallScope 枚举名（小写）对齐：auto_listing/semantic/chat/knowledge
      # 缺一个场景的后果不是「不限额」而是「该场景的用量恒记 0」——预算里看不见的调用照样在供应商那边计费
      # pricing / copy / review / qa / search_enhance 五个场景已随各自的重复入口下线（独立估值 / 文案生成 / 商品详情问答 / 管理端审核建议 / 搜索页四路增强），不在两条 AI 主线上，勿再加回
      scenarios:
        auto_listing:      # 拍照识别（发布助手）— Vision + LLM JSON，~3000 token/call
          max-tokens-per-call: 3000
          daily-token-limit: 500000
        semantic:          # 语义检索 — 仅 embedding（无生成）；上限是单次预留，用量按供应商回报记账
          max-tokens-per-call: 500
          daily-token-limit: 200000
        chat:              # AI 对话 — 工具决策 + 生成（流式/非流式），~1500 token/call
          max-tokens-per-call: 1500
          daily-token-limit: 300000
        knowledge:         # 知识库检索与摄入 — 仅 embedding（无生成）
          max-tokens-per-call: 500
          daily-token-limit: 200000
    routing:               # 模型路由 — 场景 → 模型 bean 名（接入新模型只需改配置）
      default-model: chatModel
      scenarios:
        chat_tool: decisionChatModel  # 工具决策（多步工具循环）— 快模型，只选工具不写答案
        vision: visionChatModel   # 图片分析（智能上架）— 视觉模型 Qwen-VL
        judge: chatModel          # LLM-as-Judge 评审 — 指向独立评审模型可消除自评偏差（当前只有文本模型）
    semantic-cache:        # 语义缓存 — 相似问题复用历史回答（成本优化）
      enabled: true
      similarity-threshold: 0.92
      # 命中判定要全量拉取并逐条比对，条目数直接决定未命中时的开销（见 AiProperties.SemanticCache 注释）
      max-entries: 200
      ttl-hours: 24
    chat:                  # 多轮对话记忆 + Agent 循环 — Redis 会话窗口（短期）
      session-ttl-hours: 24
      history-limit: 6
      # 多步 ReAct 循环单次上限（含 finish 轮）；达到上限未 finish 用已积累观察强制收敛
      # 工具面扩到 5 个（含 remember_preference）后由 5 上调：典型轨迹 search → 计算/详情 → remember → finish
      # 需要 4~5 步，留出余量避免工具一多反而更容易撞上限降级；步数分布见 easyorange.ai.chat.steps
      max-steps: 7
      # 历史注入 prompt 的 token 预算（估算口径见 TokenEstimator）— 轮数窗口之上的第二道裁剪，
      # 超限从最新向前保留连续窗口；<=0 关闭。指标：easyorange.ai.chat.context.tokens / .trim
      max-history-tokens: 2000

  mybatis-plus:
    # 单页条数上限，请求超出即被截断；与 API 层 PageRequest.MAX_PAGE_SIZE 口径一致
    max-limit: 100

---
# -------------------------------------------------------------------
# Spring Modulith 事件发布注册表 (Transactional Outbox)
# -------------------------------------------------------------------
spring:
  modulith:
    events:
      jdbc-schema-initialization:
        enabled: false            # 由 Flyway 管理
      republish-outstanding-events-on-restart: true
      completion-mode: update     # 完成后更新 COMPLETION_DATE，不删除；超期行由 EventPublicationArchiveTask 搬入 ARCHIVE 表
      externalization:
        enabled: true
        serialize-externalization: true
      staleness:
        published: PT5M           # PUBLISHED 超过 5 分钟标记为 FAILED
        processing: PT10M         # PROCESSING 超过 10 分钟标记为 FAILED
        check-interval: PT1M      # 每分钟检查一次

easyorange:
  events:
    # COMPLETED 事件在 EVENT_PUBLICATION 的保留天数，超期由归档任务搬入 EVENT_PUBLICATION_ARCHIVE
    archive-after-days: 7

---
# -------------------------------------------------------------------
# 缓存（Spring Cache 注解式，纯 Redis 单层）
# -------------------------------------------------------------------
easyorange:
  cache:
    # 统一 TTL：一致性靠写路径事件显式 evict，TTL 仅作兜底
    default-ttl: 30m
    # TTL 抖动比例（0~1）：写入时按比例加随机偏移，错峰过期防雪崩（0 关闭）
    ttl-jitter: 0.1
