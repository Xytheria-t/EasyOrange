spring:
  application:
    name: EasyOrange

  profiles:
    active: dev

  threads:
    virtual:
      enabled: true

  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ss
    time-zone: Asia/Shanghai

  main:
    banner-mode: console

  ai:
    # 模型由 easyorange-ai 的 AiModelConfig 手动装配（DeepSeek/Qwen-VL/Embedding），
    # 且不使用 audio/image/moderation 模型族，故整体禁用 Spring AI OpenAI 自动配置，
    # 避免无 AI key 时这些自动装配模型在启动期强制校验凭据而崩溃
    model:
      chat: false
      embedding: false
      audio.speech: false
      audio.transcription: false
      image: false
      moderation: false

  datasource:
    url: jdbc:mysql://${EASYORANGE_DB_HOST:localhost}:${EASYORANGE_DB_PORT:3306}/${EASYORANGE_DB_NAME:easyorange}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&connectTimeout=5000&socketTimeout=30000&connectionCollation=utf8mb4_0900_ai_ci
    username: ${EASYORANGE_DB_USERNAME:easyorange_app}
    password: ${EASYORANGE_DB_PASSWORD:easyorange_app_dev}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      validation-timeout: 3000
      pool-name: HikariCP-EasyOrange
      leak-detection-threshold: 60000
      connection-init-sql: SET NAMES utf8mb4

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}  # 无默认值，由各 profile 提供
      database: 0
      timeout: 10000ms

      lettuce:
        pool:
          min-idle: 5
          max-idle: 20
          max-active: 20
          max-wait: 3000ms

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  aop:
    proxy-target-class: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    clean-disabled: true
    table: flyway_schema_history
    placeholder-replacement: false
    out-of-order: false
    ignore-migration-patterns: '*:ignored'

  elasticsearch:
    uris: ${ES_URIS:http://localhost:9200}
    connection-timeout: 5s
    socket-timeout: 30s

  lifecycle:
    timeout-per-shutdown-phase: 90s

# -------------------------------------------------------------------
# Idempotency-Key 幂等配置（Filter 驱动，替代 @Idempotent AOP 切面）
# 仅对写方法 + 命中路径的请求生效；非 2xx 响应不缓存，允许客户端重试
# -------------------------------------------------------------------
idempotency:
  enabled: true
  header-name: "Idempotency-Key"
  path-patterns:
    - /api/orders
    - /api/products
    - /api/reports/product/*
    - /api/payments
  methods: [POST, PUT, PATCH]

# -------------------------------------------------------------------
# 限流 + 防重提交配置（Filter 驱动，替代 AOP 切面）
# -------------------------------------------------------------------
rate-limit-filter:
  enabled: true
  rules:
    # 商品浏览 — GET 走本地限流，零网络开销
    - path-pattern: /api/products
      method: GET
      strategy: local
      max-requests: 200
      window-seconds: 60
      message: "请求过于频繁，请稍后重试"
    - path-pattern: /api/products/{id}
      method: GET
      strategy: local
      max-requests: 200
      window-seconds: 60
      message: "请求过于频繁，请稍后重试"
    - path-pattern: /api/products/categories/**
      method: GET
      strategy: local
      max-requests: 200
      window-seconds: 60
      message: "请求过于频繁，请稍后重试"
    # 通用写操作 — Redis 分布式限流
    - path-pattern: /api/**
      method: [POST, PUT, DELETE, PATCH]
      strategy: redis
      max-requests: 30
      window-seconds: 60
      message: "操作过于频繁，请稍后重试"
  repeat-submit:
    enabled: true
    interval-ms: 3000
    message: "不允许重复提交"
    methods: [POST, PUT, DELETE, PATCH]

server:
  port: 8080
  shutdown: graceful
  servlet:
    context-path: /
  trusted-proxies: ${SERVER_TRUSTED_PROXIES:127.0.0.1,localhost,0:0:0:0:0:0:0:1}

# -------------------------------------------------------------------
# SpringDoc OpenAPI 3 — 自动生成 API 契约文档 + Swagger UI
# -------------------------------------------------------------------
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    doc-expansion: none
    persist-authorization: true
  default-flat-param-object: true

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.cartethyia.easyorange.product.adapter.outbound.persistence, com.cartethyia.easyorange.product.application.query
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    default-statement-timeout: 30
    # 枚举统一走 @EnumValue 注解字段持久化（MybatisEnumTypeHandler），不再手写 TypeHandler
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  global-config:
    banner: false
    db-config:
      logic-delete-field: delFlag
      logic-delete-value: 2
      logic-not-delete-value: 0
  pagination:
    enabled: true
    db-type: mysql
    max-limit: 100
    overflow: false
    optimize-join: true
  optimistic-lock:
    enabled: true

# -------------------------------------------------------------------
# 慢 SQL 检测（MyBatis 拦截器）
# -------------------------------------------------------------------
slow-sql:
  enabled: true
  threshold-ms: 500
  log-level: warn
  log-parameters: true
  metrics-enabled: true

management:
  tracing:
    sampling:
      probability: 0.1
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,rabbit
  endpoint:
    health:
      show-details: when-authorized
      # k8s 探针：/actuator/health/readiness + /actuator/health/liveness
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis,rabbit,ai
        liveness:
          include: livenessState

logging:
  level:
    root: INFO
    com.cartethyia.easyorange: INFO
    org.springframework: WARN
    org.springframework.aop.framework.CglibAopProxy: ERROR
    com.baomidou: WARN
    io.lettuce: WARN
    org.apache.ibatis: WARN



webmvc:
  exclude-paths:
    - /static/**
    - /public/**
    - /upload/**
    - /api/file/**
    - /favicon.ico
    - /error
    - /actuator/**
  skip-logging-paths:
    - /api/health
    - /api/stats/platform
    - /actuator/**
    - /api/file/**
  interceptor-order: 0

security:
  ignore-paths:
    - /api/auth/login
    - /api/auth/refresh
    - /api/auth/sms-code
    - /api/auth/register
    - /api/auth/password-reset
    - /api/health
    - /api/stats/platform
    - /api/products/{id}/view
    - /api/products/batch
    - /api/products/categories/cache
    # Actuator 运维端点 — 仅放行健康/信息/指标抓取（探针与 Prometheus 需匿名访问）；
    # 其中的详细内容受 show-details: when-authorized 保护。env/configprops 等敏感端点不在暴露清单内
    - /actuator/health/**
    - /actuator/info
    - /actuator/prometheus
    - /actuator/metrics
    # WebSocket 握手端点 — 由 WebSocketAuthInterceptor 自行完成 JWT 认证与吊销校验
    - /ws
    - /ws/**
    # SpringDoc OpenAPI 3 — API 契约文档 + Swagger UI（仅开发/测试环境暴露，生产通过反向代理拦截）
    - /v3/api-docs/**
    - /swagger-ui/**
    - /swagger-ui.html
  product-paths:
    - /api/products
    - /api/products/{id}
    - /api/products/categories/**
    - /api/products/search
    - /api/products/search/**
    - /api/products/{id}/similar
    - /api/products/{id}/reviews
    - /api/products/{id}/reviews/stats
  static-paths:
    - /static/**
    - /public/**
    - /upload/**
    - /api/file/**
    - /favicon.ico
    - /error
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176,http://localhost:5177,http://localhost:5178,http://localhost:3000,http://127.0.0.1:5173}

easyorange:
  validation:
    password:
      weak-list:
        - "Password1!"
        - "Password123!"
        - "Qwerty123!"
        - "Admin123!"
        - "Welcome1!"
        - "Letmein1!"
        - "Abc123!@"
        - "Test123!"
        - "Passw0rd!"
        - "P@ssw0rd!"
        - "Password!1"
        - "Admin@123"

  search:
    elasticsearch:
      enabled: false

  file:
    image:
      quality: 0.80
      thumbnail-quality: 0.75
      responsive-quality: 0.75
      progressive-jpeg:
        enabled: true
        min-size: 102400
      smart-crop:
        enabled: true
        default-aspect-ratio: 1:1
        min-entropy-threshold: 0.5

  ai:
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: https://api.deepseek.com
      model: deepseek-chat
      timeout: 30000
    qwen-vl:
      api-key: ${QWEN_VL_API_KEY:}
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      model: qwen-vl-max
      timeout: 60000
    embedding:
      api-key: ${EMBEDDING_API_KEY:}
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      model: text-embedding-v3
      dimensions: 1024
      timeout: 30000
    cache:
      stale-max-size: 5000
      stale-expire-hours: 24
    rate-limit:
      enabled: true
      fail-open: true
    budget:
      enabled: true
      # 按场景配置 token 预算 — 覆盖 @TokenBudget 注解默认值，运维可热更新而无需发版
      # scenario 键与 AiCallScope 枚举名（小写）对齐：pricing/review/copy/auto_listing/semantic/qa
      scenarios:
        pricing:           # 智能估值 — LLM JSON 输出，~2000 token/call
          max-tokens-per-call: 2000
          daily-token-limit: 500000
        review:            # 商品审核 — LLM JSON 输出，~2000 token/call
          max-tokens-per-call: 2000
          daily-token-limit: 500000
        copy:              # 文案生成 — LLM JSON 输出（200-500 字描述），~2500 token/call
          max-tokens-per-call: 2500
          daily-token-limit: 500000
        auto_listing:      # 智能上架 — Vision + LLM JSON，~3000 token/call
          max-tokens-per-call: 3000
          daily-token-limit: 500000
        semantic:          # 语义搜索 — 仅 embedding（无生成），~500 token/call
          max-tokens-per-call: 500
          daily-token-limit: 200000
        qa:                # 智能客服 — LLM 文本输出（50 字内），~1000 token/call
          max-tokens-per-call: 1000
          daily-token-limit: 200000
        chat:              # AI 对话 — 工具决策 + 生成（流式/非流式），~1500 token/call
          max-tokens-per-call: 1500
          daily-token-limit: 300000
    eval:                  # LLM-as-Judge 离线评估 — 定时给 eo_ai_call_log 未评审记录打分
      enabled: false       # 默认关闭；开启后按 cron 每天对成功调用打分（1-5 + 评语）
      cron: "0 0 3 * * ?"
      batch-size: 50
      retrieval-enabled: false   # RAG 检索指标回归（hit@5 / MRR）— 仅需 embedding，默认关闭
      retrieval-cron: "0 15 3 * * ?"
    routing:               # 模型路由 — 场景 → 模型 bean 名（接入第二个模型只需改配置）
      default-model: chatModel
      scenarios:
        chat_tool: chatModel
    semantic-cache:        # 语义缓存 — 相似问题复用历史回答（成本优化）
      enabled: true
      similarity-threshold: 0.92
      max-entries: 500
      ttl-hours: 24
    chat:                  # 多轮对话记忆 — Redis 会话窗口（短期）
      session-ttl-hours: 24
      history-limit: 6

---
# -------------------------------------------------------------------
# Spring Modulith 事件发布注册表 (Transactional Outbox)
# -------------------------------------------------------------------
spring:
  modulith:
    events:
      jdbc-schema-initialization:
        enabled: false            # 由 Flyway 管理
      republish-outstanding-events-on-restart: true
      completion-mode: update     # 完成后更新 COMPLETION_DATE，不删除
      externalization:
        enabled: true
        serialize-externalization: true
      staleness:
        published: PT5M           # PUBLISHED 超过 5 分钟标记为 FAILED
        processing: PT10M         # PROCESSING 超过 10 分钟标记为 FAILED
        check-interval: PT1M      # 每分钟检查一次

---
# -------------------------------------------------------------------
# 缓存（Spring Cache 注解式，纯 Redis 单层）
# -------------------------------------------------------------------
easyorange:
  cache:
    # 统一 TTL：一致性靠写路径事件显式 evict，TTL 仅作兜底
    default-ttl: 30m
