jwt:
  secret-key: test-secret-key-for-unit-testing-must-be-at-least-32-chars
  access-token-expiration: 30
  refresh-token-expiration: 7
  token-prefix: "Bearer "
  issuer: easyorange
  auto-renew-threshold-minutes: 5

security:
  ignore-paths:
    - /api/auth/login
    - /api/auth/logout
    - /api/auth/refresh
    - /api/password/register
    - /api/password/forgot
  product-paths: []
  static-paths: []
  allowed-origins:
    - "http://localhost:5173"
