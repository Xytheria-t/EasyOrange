<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="我的收藏 - EasyOrange校园二手交易平台">
    <meta name="keywords" content="校园二手, 收藏, EasyOrange">
    <title>我的收藏 - EasyOrange</title>
    
    <link rel="preconnect" href="https://cdn.bootcdn.net">
    <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.bootcdn.net/ajax/libs/normalize/8.0.1/normalize.min.css" rel="stylesheet">
    <!-- Ultra Premium Fonts -->
    <!-- Playfair Display: 时尚杂志级优雅大标题字体 (VOGUE, Harper's BAZAAR) -->
    <!-- Cormorant Garamond: 奢侈品级精致数字字体 (爱马仕、香奈儿风格) -->
    <link href="https://fonts.font.im/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- 中文字体：思源宋体 + 思源黑体 -->
    <link href="https://cdn.bootcdn.net/npm/source-han-serif-cn/1.0.0/css/source-han-serif-cn.min.css" rel="stylesheet">
    <link href="https://cdn.bootcdn.net/npm/source-han-sans-cn/1.0.0/css/source-han-sans-cn.min.css" rel="stylesheet">
    
    <link rel="preload" href="/src/styles/main.css" as="style">
    <link rel="preload" href="/src/styles/favorites.css" as="style">
</head>
<body class="favorites-page">
    <div class="favorites-bg">
        <div class="bg-gradient-layer"></div>
        <div class="bg-noise"></div>
        <div class="floating-orbs">
            <div class="orb orb-1"></div>
            <div class="orb orb-2"></div>
            <div class="orb orb-3"></div>
        </div>
    </div>

    <header class="unified-header">
        <div class="header-container">
            <a href="/" class="brand-logo">
                <div class="logo-icon">
                        <svg viewBox="0 0 40 40" fill="none">
                            <defs>
                                <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" stop-color="#F97316"/>
                                    <stop offset="40%" stop-color="#FB7185"/>
                                    <stop offset="100%" stop-color="#C39BD3"/>
                                </linearGradient>
                            </defs>
                            <path d="M6 10h11M6 10v20M6 30h11M6 10h7M6 20h9" stroke="url(#logoGradient)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                            <circle cx="30" cy="20" r="8" stroke="url(#logoGradient)" stroke-width="2.5"/>
                        </svg>
                    </div>
                <span class="brand-name">EasyOrange</span>
            </a>
            
            <nav class="header-nav" role="navigation" aria-label="主导航">
                <a href="/" class="nav-item">首页</a>
                <a href="/products.html" class="nav-item">商品</a>
            </nav>
            
            <div class="header-actions">
                <button class="notification-btn" id="notificationBtn" aria-label="通知">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                    </svg>
                    <span class="notification-dot"></span>
                </button>
                <div class="user-menu" id="userMenu">
                        <button class="user-avatar-btn" id="userAvatarBtn">
                            <span class="user-name" id="userName"></span>
                            <svg class="dropdown-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="6 9 12 15 18 9"/>
                            </svg>
                        </button>
                        <div class="user-dropdown" id="userDropdown">
                            <a href="/profile.html" class="dropdown-item">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                                <circle cx="12" cy="7" r="4"/>
                            </svg>
                            <span>个人中心</span>
                        </a>
                        <a href="/favorites.html" class="dropdown-item active">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                            </svg>
                            <span>我的收藏</span>
                        </a>
                        <div class="dropdown-divider"></div>
                        <button class="dropdown-item logout-btn" id="logoutBtn">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                                <polyline points="16 17 21 12 16 7"/>
                                <line x1="21" y1="12" x2="9" y2="12"/>
                            </svg>
                            <span>退出登录</span>
                        </button>
                    </div>
                </div>
                <button class="login-btn" id="loginBtn" style="display: none;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                    <span>登录</span>
                </button>
            </div>
            
            <button class="mobile-menu-btn" aria-label="菜单" aria-expanded="false">
                <span class="hamburger"></span>
            </button>
        </div>
    </header>

    <main class="favorites-main">
        <div class="favorites-container">
            <div class="page-header">
                <div class="page-title-section">
                    <h1 class="page-title">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                        </svg>
                        我的收藏
                    </h1>
                    <p class="page-subtitle">您收藏的心仪好物都在这里</p>
                </div>
                <div class="page-actions">
                    <div class="favorites-count" id="favoritesCount">
                        <span class="count-number">0</span>
                        <span class="count-label">件商品</span>
                    </div>
                    <button class="btn btn-secondary" id="selectAllBtn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="9 11 12 14 22 4"/>
                            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
                        </svg>
                        全选
                    </button>
                    <button class="btn btn-danger" id="deleteSelectedBtn" style="display: none;">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="3 6 5 6 21 6"/>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                        </svg>
                        删除选中
                    </button>
                </div>
            </div>

            <div class="favorites-toolbar">
                <div class="search-box">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"/>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                    </svg>
                    <input type="text" id="searchInput" placeholder="搜索收藏商品..." aria-label="搜索收藏">
                    <button class="search-clear" id="searchClear" aria-label="清除搜索">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18"/>
                            <line x1="6" y1="6" x2="18" y2="18"/>
                        </svg>
                    </button>
                </div>
                <div class="sort-options">
                    <label for="sortSelect">排序：</label>
                    <select id="sortSelect">
                        <option value="newest">最近收藏</option>
                        <option value="price_asc">价格从低到高</option>
                        <option value="price_desc">价格从高到低</option>
                        <option value="name">按名称</option>
                    </select>
                </div>
            </div>

            <div class="favorites-content">
                <div class="favorites-grid" id="favoritesGrid">
                </div>

                <div class="loading-state" id="loadingState" style="display: none;">
                    <div class="loading-spinner"></div>
                    <p>加载中...</p>
                </div>

                <div class="empty-state" id="emptyState" style="display: none;">
                    <div class="empty-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                        </svg>
                    </div>
                    <h3>暂无收藏商品</h3>
                    <p>去商品广场逛逛，收藏您喜欢的商品吧</p>
                    <a href="/products.html" class="btn btn-primary">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"/>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                        </svg>
                        浏览商品
                    </a>
                </div>

                <div class="no-results" id="noResults" style="display: none;">
                    <div class="no-results-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <circle cx="11" cy="11" r="8"/>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                            <line x1="8" y1="8" x2="14" y2="14"/>
                            <line x1="14" y1="8" x2="8" y2="14"/>
                        </svg>
                    </div>
                    <h3>未找到匹配的商品</h3>
                    <p>尝试其他关键词搜索</p>
                    <button class="btn btn-secondary" id="clearSearch">清除搜索</button>
                </div>
            </div>
        </div>
    </main>

    <div class="toast" id="toast"></div>

    <script src="/src/pages/favorites/index.ts" type="module"></script>
</body>
</html>
