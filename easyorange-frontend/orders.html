<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="我的订单 - EasyOrange校园二手交易平台">
    <title>我的订单 - EasyOrange</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700;800;900&family=Crimson+Pro:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="preload" href="/src/styles/main.css" as="style">
    <link rel="preload" href="/src/styles/orders.css" as="style">
</head>
<body class="orders-page-shell">
    <div class="orders-bg">
        <div class="bg-gradient-layer"></div>
        <div class="bg-noise"></div>
        <div class="floating-orbs">
            <div class="orb orb-1"></div>
            <div class="orb orb-2"></div>
            <div class="orb orb-3"></div>
        </div>
    </div>

    <header class="unified-header">
        <div class="header-container">
            <a href="/" class="brand-logo">
                <div class="logo-icon">
                    <svg viewBox="0 0 40 40" fill="none">
                        <circle cx="20" cy="20" r="18" stroke="url(#logoGradient)" stroke-width="2"/>
                        <path d="M12 20c0-4.4 3.6-8 8-8s8 3.6 8 8-3.6 8-8 8" stroke="url(#logoGradient)" stroke-width="2" stroke-linecap="round"/>
                        <circle cx="20" cy="20" r="3" fill="url(#logoGradient)"/>
                        <defs>
                            <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#6366F1"/>
                                <stop offset="100%" stop-color="#EC4899"/>
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
                <span class="brand-name">EasyOrange</span>
            </a>

            <nav class="header-nav" role="navigation" aria-label="主导航">
                <a href="/" class="nav-item">首页</a>
                <a href="/products.html" class="nav-item">商品</a>
            </nav>

            <div class="header-actions">
                <button class="notification-btn" id="notificationBtn" aria-label="通知">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                    </svg>
                    <span class="notification-dot"></span>
                </button>
                <div class="user-menu" id="userMenu">
                    <button class="user-avatar-btn" id="userAvatarBtn">
                        <span class="user-name" id="userName"></span>
                        <svg class="dropdown-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="6 9 12 15 18 9"/>
                        </svg>
                    </button>
                    <div class="user-dropdown" id="userDropdown">
                        <a href="/profile.html" class="dropdown-item">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                                <circle cx="12" cy="7" r="4"/>
                            </svg>
                            <span>个人中心</span>
                        </a>
                        <a href="/favorites.html" class="dropdown-item">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                            </svg>
                            <span>我的收藏</span>
                        </a>
                        <div class="dropdown-divider"></div>
                        <button class="dropdown-item logout-btn" id="logoutBtn">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                                <polyline points="16 17 21 12 16 7"/>
                                <line x1="21" y1="12" x2="9" y2="12"/>
                            </svg>
                            <span>退出登录</span>
                        </button>
                    </div>
                </div>
                <button class="login-btn is-hidden" id="loginBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                    <span>登录</span>
                </button>
            </div>

            <button class="mobile-menu-btn" aria-label="菜单" aria-expanded="false">
                <span class="hamburger"></span>
            </button>
        </div>
    </header>

    <main class="orders-main">
        <div class="orders-container">
            <section class="orders-hero">
                <div class="orders-hero-copy">
                    <span class="orders-kicker">Transaction Ledger / 06</span>
                    <h1 class="orders-title">把每一笔交易整理成一张清楚、可信、可追踪的个人订单页</h1>
                    <p class="orders-subtitle">这里不只是订单列表，而是你的校园交易履历。买家和卖家视角分开梳理，状态、金额和关键节点都能一眼读懂。</p>
                    <div class="orders-hero-points">
                        <span>买卖视角独立切换</span>
                        <span>订单状态与时间线联动</span>
                        <span id="ordersHeroRoleLabel">当前视角：我买的</span>
                    </div>
                </div>
                <div class="orders-hero-panel">
                    <div class="orders-hero-stat">
                        <span class="orders-hero-label">当前订单数</span>
                        <strong class="orders-hero-value" id="ordersHeroCount">0 笔</strong>
                    </div>
                    <div class="orders-hero-stat">
                        <span class="orders-hero-label">当前交易额</span>
                        <strong class="orders-hero-value" id="ordersHeroAmount">¥0.00</strong>
                    </div>
                    <div class="orders-hero-note-card">
                        <span class="orders-hero-label">本页焦点</span>
                        <p id="ordersHeroFocus">加载订单后，这里会提示你当前最值得优先处理的交易节点。</p>
                    </div>
                    <div class="orders-hero-note-card orders-hero-note-card--accent">
                        <span class="orders-hero-label">交易备忘</span>
                        <p id="ordersHeroMemo">把待支付、待发货、待收货的订单先处理掉，整条交易链路会显得更有秩序。</p>
                    </div>
                </div>
            </section>

            <section class="orders-stage">
                <div class="orders-stage-top">
                    <div class="orders-role-switch" id="ordersRoleSwitch" role="tablist" aria-label="订单视角">
                        <button type="button" class="orders-role-tab is-active" data-role="buyer" aria-selected="true">我买的</button>
                        <button type="button" class="orders-role-tab" data-role="seller" aria-selected="false">我卖的</button>
                    </div>
                    <div class="orders-stage-caption" id="ordersStageCaption">查看你作为买家的交易进度、付款状态与收货节点。</div>
                </div>

                <div class="orders-filter-row">
                    <div class="orders-filter-label">状态筛选</div>
                    <div class="orders-status-filters" id="ordersStatusFilters" aria-label="订单状态筛选"></div>
                </div>

                <div class="orders-summary-strip" id="ordersSummaryStrip"></div>

                <div class="orders-list-shell">
                    <div class="orders-list" id="ordersList" aria-live="polite"></div>
                </div>
            </section>
        </div>
    </main>

    <div class="orders-modal" id="orderDetailModal" aria-hidden="true">
        <div class="orders-modal-backdrop" data-close-modal="true"></div>
        <div class="orders-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="orderDetailTitle">
            <button type="button" class="orders-modal-close" id="orderDetailClose" aria-label="关闭订单详情">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"/>
                    <line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
            </button>
            <div class="orders-modal-content" id="orderDetailContent">
                <h2 class="orders-modal-title" id="orderDetailTitle">订单详情</h2>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="/src/pages/orders.ts" type="module"></script>
</body>
</html>
