# Modern security headers — include in server/location blocks with add_header
# References:
#   https://securityheaders.com/
#   https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Content-Security-Policy

# Prevent MIME type sniffing
add_header X-Content-Type-Options "nosniff" always;

# Prevent clickjacking (legacy fallback; CSP frame-ancestors is the modern control)
add_header X-Frame-Options "DENY" always;

# Control referrer information leakage
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Restrict browser features (replaces Feature-Policy; interest-cohort = FLoC opt-out)
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

# Content Security Policy — defence-in-depth XSS protection
#   default-src 'self'        : base restriction
#   script-src 'self'         : no inline/eval scripts (Vite builds static bundles)
#   style-src 'self' 'unsafe-inline' : allow React style={} prop, CSS-in-JS
#   img-src 'self' data: blob:       : allow image preview / upload thumbnails
#   font-src 'self'           : self-hosted fonts only
#   connect-src 'self'        : all XHR/fetch goes through backend proxy
#   frame-ancestors 'none'    : no framing (modern X-Frame-Options replacement)
#   base-uri 'self'           : lock <base> to origin
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
